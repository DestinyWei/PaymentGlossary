6B\" font-size=\"11\" font-family=\"DM Sans, sans-serif\">与商户签约 · 结算<\u002Ftext><\u002Fg>\n    <path d=\"M149 222 L264 278\" fill=\"none\" stroke=\"#0E7C6B\" stroke-width=\"1\" marker-end=\"url(#marr)\"><\u002Fpath>\n    <path d=\"M340 222 L340 278\" fill=\"none\" stroke=\"#0E7C6B\" stroke-width=\"1\" marker-end=\"url(#marr)\"><\u002Fpath>\n    <path d=\"M531 222 L416 278\" fill=\"none\" stroke=\"#0E7C6B\" stroke-width=\"1\" marker-end=\"url(#marr)\"><\u002Fpath>\n    <g style=\"cursor:pointer\"><rect x=\"190\" y=\"278\" width=\"300\" height=\"52\" rx=\"8\" stroke-width=\"0.5\" fill=\"#ECE9F8\" stroke=\"#5C4BB0\"><\u002Frect><text x=\"340\" y=\"298\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#5C4BB0\" font-size=\"13\" font-weight=\"500\" font-family=\"DM Sans, sans-serif\">Scheme / Network（卡组织）<\u002Ftext><text x=\"340\" y=\"316\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#5C4BB0\" font-size=\"11\" font-family=\"DM Sans, sans-serif\">Visa · Mastercard · UnionPay · Amex<\u002Ftext><\u002Fg>\n    <line x1=\"340\" y1=\"330\" x2=\"340\" y2=\"358\" stroke=\"#5C4BB0\" stroke-width=\"1.5\" marker-end=\"url(#marr)\"><\u002Fline>\n    <g style=\"cursor:pointer\"><rect x=\"190\" y=\"358\" width=\"300\" height=\"52\" rx=\"8\" stroke-width=\"0.5\" fill=\"#ECE9F8\" stroke=\"#5C4BB0\"><\u002Frect><text x=\"340\" y=\"378\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#5C4BB0\" font-size=\"13\" font-weight=\"500\" font-family=\"DM Sans, sans-serif\">Issuer（发卡行）<\u002Ftext><text x=\"340\" y=\"396\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#5C4BB0\" font-size=\"11\" font-family=\"DM Sans, sans-serif\">向消费者发卡 · 风控 · 收IC费<\u002Ftext><\u002Fg>\n    <line x1=\"340\" y1=\"410\" x2=\"340\" y2=\"436\" stroke=\"#C5DDD4\" stroke-width=\"1\" stroke-dasharray=\"4 3\" marker-end=\"url(#marr)\"><\u002Fline>\n    <g style=\"cursor:pointer\"><rect x=\"265\" y=\"436\" width=\"150\" height=\"36\" rx=\"8\" stroke-width=\"0.5\" fill=\"#F9E8F0\" stroke=\"#A6396A\"><\u002Frect><text x=\"340\" y=\"454\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#A6396A\" font-size=\"13\" font-weight=\"500\" font-family=\"DM Sans, sans-serif\">持卡人（账单）<\u002Ftext><\u002Fg>\n    <g style=\"cursor:pointer\"><rect x=\"20\" y=\"278\" width=\"140\" height=\"52\" rx=\"8\" stroke-width=\"0.5\" fill=\"#ECF1EE\" stroke=\"#9DB0A8\"><\u002Frect><text x=\"90\" y=\"298\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#5C6B64\" font-size=\"13\" font-weight=\"500\" font-family=\"DM Sans, sans-serif\">ISO（销售组织）<\u002Ftext><text x=\"90\" y=\"316\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#5C6B64\" font-size=\"11\" font-family=\"DM Sans, sans-serif\">拓展商户 · 赚分润<\u002Ftext><\u002Fg>\n    <path d=\"M149 218 L90 276\" fill=\"none\" stroke=\"#B0C4BB\" stroke-width=\"1\" stroke-dasharray=\"3 3\" marker-end=\"url(#marr)\"><\u002Fpath>\n    <g style=\"cursor:pointer\"><rect x=\"520\" y=\"278\" width=\"140\" height=\"52\" rx=\"8\" stroke-width=\"0.5\" fill=\"#ECF1EE\" stroke=\"#9DB0A8\"><\u002Frect><text x=\"590\" y=\"298\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#5C6B64\" font-size=\"13\" font-weight=\"500\" font-family=\"DM Sans, sans-serif\">Processor（处理商）<\u002Ftext><text x=\"590\" y=\"316\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#5C6B64\" font-size=\"11\" font-family=\"DM Sans, sans-serif\">处理授权 · 清算<\u002Ftext><\u002Fg>\n    <path d=\"M531 218 L590 276\" fill=\"none\" stroke=\"#B0C4BB\" stroke-width=\"1\" stroke-dasharray=\"3 3\" marker-end=\"url(#marr)\"><\u002Fpath>\n    <text x=\"340\" y=\"480\" text-anchor=\"middle\" fill=\"#B0C4BB\" font-size=\"11\" font-family=\"DM Mono, monospace\">Issuer收IC · Scheme收网络费 · Acquirer/PSP收Markup<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">各角色完整介绍<\u002Fdiv>\n  <div class=\"role-grid\">\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-pink\">持卡人<\u002Fspan><span class=\"role-title\">Cardholder<\u002Fspan><\u002Fdiv><div class=\"role-body\">支付流程的发起端。<strong>权利：<\u002Fstrong>发起 Chargeback 是对抗欺诈的核心武器，由 Issuer 代为执行，可强制撤回已结算资金。<strong>义务：<\u002Fstrong>保管卡片和 CVV/PIN，因个人疏忽导致的损失由持卡人承担。<strong>Crypto 类比：<\u002Fstrong>持有私钥的用户，但卡支付有 Issuer 兜底，Crypto 无第三方保护。<\u002Fdiv><\u002Fdiv>\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-amber\">Gateway<\u002Fspan><span class=\"role-title\">Payment Gateway，支付网关<\u002Fspan><\u002Fdiv><div class=\"role-body\">纯数据管道，不碰资金。<strong>核心职责：<\u002Fstrong>①加密卡数据；②Tokenization 令牌化；③将授权请求路由至正确的 Acquirer。<strong>盈利模式：<\u002Fstrong>按交易笔数收网关费（$0.05–$0.15/笔），大多数被 PSP 整合。<strong>典型：<\u002Fstrong>Stripe（Gateway+PSP 一体化）。<\u002Fdiv><\u002Fdiv>\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-teal\">PSP / PayFac<\u002Fspan><span class=\"role-title\">Payment Service Provider / Facilitator<\u002Fspan><\u002Fdiv><div class=\"role-body\">一站式支付接入，整合 Gateway+Acquirer。<strong>PayFac 与 PSP 区别：<\u002Fstrong>PayFac 是卡组织正式注册角色，可为 Sub-merchant 快速开户（几分钟 vs 几周），直接承担资金风险。<strong>盈利：<\u002Fstrong>MDR 中的 Markup 部分（0.2–0.5%）。<strong>典型：<\u002Fstrong>Stripe、Adyen、Square。<\u002Fdiv><\u002Fdiv>\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-teal\">MoR<\u002Fspan><span class=\"role-title\">Merchant of Record，记录商户<\u002Fspan><\u002Fdiv><div class=\"role-body\">法律上的\"卖方\"，承担：①全球 VAT/GST 税务合规（商家无需在每国注册税号）；②退款责任（持卡人直接向 MoR 提出，MoR 垫付后向商家追偿）；③PCI DSS 卡数据合规。<strong>代价：<\u002Fstrong>比直接收款多收3–5%费用。<strong>典型：<\u002Fstrong>Paddle、FastSpring。<\u002Fdiv><\u002Fdiv>\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-teal\">Acquirer<\u002Fspan><span class=\"role-title\">Acquiring Bank，收单行<\u002Fspan><\u002Fdiv><div class=\"role-body\">商户的\"开户银行\"，与商户签署 Merchant Agreement。<strong>核心职责：<\u002Fstrong>①向卡组织提交 Auth 请求；②汇总 Capture 参与 Clearing；③扣除 MDR 后向商户结算。<strong>风险：<\u002Fstrong>商户欺诈或 Chargeback 损失最终由 Acquirer 兜底。<strong>典型：<\u002Fstrong>Chase Paymentech、Worldpay、Adyen。<\u002Fdiv><\u002Fdiv>\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-purple\">Scheme<\u002Fspan><span class=\"role-title\">Card Network，卡组织<\u002Fspan><\u002Fdiv><div class=\"role-body\">规则制定者和清算网络运营者。<strong>核心职责：<\u002Fstrong>①制定所有参与方规则（Visa Core Rules 数千页）；②提供 Auth 路由网络；③管理 Clearing 净额计算；④管理品牌信任背书。<strong>盈利：<\u002Fstrong>Scheme fee（网络使用费），向 Issuer 和 Acquirer 两侧均收费。<strong>主要玩家：<\u002Fstrong>Visa、Mastercard、UnionPay、Amex。<\u002Fdiv><\u002Fdiv>\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-purple\">Issuer<\u002Fspan><span class=\"role-title\">Issuing Bank，发卡行<\u002Fspan><\u002Fdiv><div class=\"role-body\">持卡人的银行。<strong>核心职责：<\u002Fstrong>①审批开卡申请，决定授信额度；②在 Auth 阶段验证卡片有效性和风控；③承担信用卡的信用风险；④处理 Chargeback 争议。<strong>盈利：<\u002Fstrong>IC（交换费，占 MDR 最大部分，约1–1.5%）+ 年费 + 利息。为什么 IC 最高？Issuer 承担了信用风险，费率体现风险溢价。<\u002Fdiv><\u002Fdiv>\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-gray\">ISO<\u002Fspan><span class=\"role-title\">Independent Sales Organization<\u002Fspan><\u002Fdiv><div class=\"role-body\">帮助 Acquirer 拓展商户的中间商，不承担资金风险（与 PayFac 的本质区别）。<strong>盈利：<\u002Fstrong>从 Acquirer 的 Markup 中分得一部分，按月 TPV 比例持续分润（Residual Income）。<strong>典型场景：<\u002Fstrong>专注餐饮/零售的 POS 服务商，通过 ISO 身份接入大型 Acquirer 体系。<\u002Fdiv><\u002Fdiv>\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-gray\">Processor<\u002Fspan><span class=\"role-title\">Payment Processor，支付处理商<\u002Fspan><\u002Fdiv><div class=\"role-body\">实际执行交易授权、清算技术处理的机构，有时与 Acquirer 是同一实体，有时是独立技术服务商。<strong>分工：<\u002Fstrong>大型银行（如 Chase）自己既是 Acquirer 也是 Processor；中小银行把处理外包给独立 Processor（如 FIS、Fiserv、TSYS）。<strong>行业格局：<\u002Fstrong>FIS、Fiserv、Global Payments 是全球最大的独立 Processor。<\u002Fdiv><\u002Fdiv>\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-amber\">VASP<\u002Fspan><span class=\"role-title\">Virtual Asset Service Provider<\u002Fspan><\u002Fdiv><div class=\"role-body\">提供加密货币相关服务的机构统称，FATF 框架下的监管对象。<strong>涵盖：<\u002Fstrong>CEX、OTC 交易商、加密托管商、稳定币支付服务商。<strong>核心义务：<\u002Fstrong>KYC/AML 合规 + Travel Rule（转账超阈值传递身份信息）+ 向监管机构注册持牌。<strong>与传统对应关系：<\u002Fstrong>CEX ≈ Issuer+Acquirer+Gateway 的集合体。<\u002Fdiv><\u002Fdiv>\n    <div class=\"role-card\"><div class=\"role-head\"><span class=\"role-badge badge-gray\">POS / mPOS<\u002Fspan><span class=\"role-title\">Point of Sale / Mobile POS，销售终端<\u002Fspan><\u002Fdiv><div class=\"role-body\"><strong>POS：<\u002Fstrong>实体店固定刷卡/扫码设备，集成 NFC（Apple Pay）、扫码、打印功能。<strong>mPOS：<\u002Fstrong>手机连接的小型读卡器（Square、SumUp），适合流动摊贩、展会，降低了接入正规支付体系的门槛。<strong>SoftPOS（新趋势）：<\u002Fstrong>直接用智能手机 NFC 收款，无需外接硬件（Visa Tap to Phone 方案）。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"case-box teal\">\n    <div class=\"case-label teal\">费用归属总结<\u002Fdiv>\n    每笔刷卡中，MDR 的三个组成部分流向不同口袋：<span class=\"hlp\">IC 费（约1–1.5%）<\u002Fspan>归 Issuer；<span class=\"hlb\">Scheme fee（约0.1–0.2%）<\u002Fspan>归卡组织；<span class=\"hlg\">Markup（约0.2–0.5%）<\u002Fspan>归 Acquirer/PSP。商家承担了全部 MDR，消费者感知不到这笔费用，但它反映在商品定价中。\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ════ 交易生命周期 ════ -->\n<div id=\"sec-txlife\" class=\"section\">\n<h2 class=\"section-title\">交易生命周期<\u002Fh2>\n<p class=\"section-desc\">从授权到结算，每个阶段发生在不同时间节点，处理成本和逆转难度依次递增。<\u002Fp>\n\n<div class=\"card\">\n  <div class=\"card-title\">全览<\u002Fdiv>\n  <div class=\"chain\">\n    <div class=\"chain-node cn-gray\">Auth 授权<\u002Fdiv><div class=\"chain-arrow\">→<\u002Fdiv>\n    <div class=\"chain-node cn-blue\">Capture 请款<\u002Fdiv><div class=\"chain-arrow\">→<\u002Fdiv>\n    <div class=\"chain-node cn-blue\">Clearing 清算<\u002Fdiv><div class=\"chain-arrow\">→<\u002Fdiv>\n    <div class=\"chain-node cn-teal\">Settlement 结算<\u002Fdiv><div class=\"chain-arrow\">⇄<\u002Fdiv>\n    <div class=\"chain-node cn-amber\">Void 撤销<\u002Fdiv><div class=\"chain-arrow\">或<\u002Fdiv>\n    <div class=\"chain-node cn-red\">Refund 退款<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\"><span class=\"abbr\">Auth<\u002Fspan> — Authorization，授权<\u002Fdiv>\n  <p class=\"prose\">发卡行验证账户可扣款并<span class=\"hl\">预留（冻结）额度<\u002Fspan>，不是真正扣款。有效期通常7天，超时自动失效。<\u002Fp>\n  <hr class=\"div\">\n  <div class=\"card-title\" style=\"margin-top:0\">Pre-auth（预授权）<\u002Fdiv>\n  <p class=\"prose\">先授权估算金额，Capture 时调整为最终金额。酒店入住冻结$200押金、加油站预授权$100，都是 Pre-auth 场景。Capture 金额可低于授权额，不能高于（否则需要额外 Auth）。<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\"><span class=\"abbr\">Capture<\u002Fspan> — 请款<\u002Fdiv>\n  <p class=\"prose\">商家发货或服务完成后触发，正式发起资金流转。最晚不超过7天（超过 Auth 有效期则失败）。<\u002Fp>\n  <div class=\"grid2\" style=\"margin-top:10px\">\n    <div class=\"grid-card\"><div class=\"label\">Full Capture（全额请款）<\u002Fdiv><div class=\"body\">最常见，一次性请款全部授权金额。<\u002Fdiv><\u002Fdiv>\n    <div class=\"grid-card\"><div class=\"label\">Partial Capture（部分请款）<\u002Fdiv><div class=\"body\">只请款部分金额（如分批发货），剩余授权额度自动释放。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\"><span class=\"abbr\">Void<\u002Fspan>（撤销）vs <span class=\"abbr\">Refund<\u002Fspan>（退款）<\u002Fdiv>\n  <div class=\"grid2\">\n    <div class=\"grid-card\" style=\"border-left:3px solid #8C5A11\">\n      <div class=\"label\" style=\"color:var(--amber)\">Void（撤销）<\u002Fdiv>\n      <div class=\"body\">在 <strong>Capture 发出之前<\u002Fstrong>取消整笔 Auth。资金直接解冻，<span class=\"hlg\">无需资金流转<\u002Fspan>，无额外手续费，对 CBR 无影响。到账：即时或次日。<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid-card\" style=\"border-left:3px solid #C13A2D\">\n      <div class=\"label\" style=\"color:var(--red)\">Refund（退款）<\u002Fdiv>\n      <div class=\"body\">在 <strong>结算完成之后<\u002Fstrong>发起逆向资金流转。原路退回，T+3至T+5。产生手续费 $0.15–$0.25/笔。<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <hr class=\"div\">\n  <p class=\"prose\"><strong>ARN（Acquirer Reference Number，收单参考号）：<\u002Fstrong>退款发起后生成的唯一追踪编号，23位数字，可在 Stripe/Adyen 后台查到。持卡人向银行查询\"退款去哪了\"时，银行客服用 ARN 定位资金节点。<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\"><span class=\"abbr\">Recurring<\u002Fspan> — 定期扣款/订阅支付<\u002Fdiv>\n  <p class=\"prose\"><span class=\"hlr\">注意：<\u002Fspan>是<strong>持卡人<\u002Fstrong>授权后，商户定期自动扣款——授权主体是持卡人，商户只是执行方。<\u002Fp>\n  <hr class=\"div\">\n  <div class=\"card-title\" style=\"margin-top:0\">MIT vs CIT<\u002Fdiv>\n  <div class=\"grid2\">\n    <div class=\"grid-card\">\n      <div class=\"label\">CIT · Cardholder-Initiated Transaction<\u002Fdiv>\n      <div class=\"body\">持卡人<strong>主动在场<\u002Fstrong>触发，可触发3DS/SCA验证。<br>例：网页输入卡号结账。<br><span class=\"hlg\">欺诈责任：<\u002Fspan>发卡行承担更多（已验证身份）。<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid-card\">\n      <div class=\"label\">MIT · Merchant-Initiated Transaction<\u002Fdiv>\n      <div class=\"body\">持卡人<strong>不在场<\u002Fstrong>，商户凭 Mandate 自动扣款。<br>例：Netflix月费、Uber行程后自动扣款。<br><span class=\"hlr\">欺诈责任：<\u002Fspan>更多落在商户和收单行一侧。<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"step\" style=\"margin-top:10px\"><div class=\"step-num\">1<\u002Fdiv><div class=\"step-body\"><strong>初始 CIT：<\u002Fstrong>用户首次订阅，主动输入卡号，触发3DS，同时生成 Mandate（授权书），写入卡组织系统。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">2<\u002Fdiv><div class=\"step-body\"><strong>后续 MIT：<\u002Fstrong>每月自动扣款，附上 MIT 标识和 Mandate ID，跳过3DS，直接批准。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num red\">!<\u002Fdiv><div class=\"step-body\"><strong>Chargeback 高发：<\u002Fstrong>\"我不记得授权了这个扣款\"——商家必须保留 Mandate 原始记录作为争议证据。<\u002Fdiv><\u002Fdiv>\n  <div class=\"warn-box\"><strong>Dunning（催收重试）：<\u002Fstrong>MIT 扣款失败时，商户系统按策略重试。合规上限：最多3次，间隔至少1天。过度重试触发欺诈标记。Stripe Billing、Chargebee 内置 Dunning 引擎。<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">PCI DSS 四个合规等级<\u002Fdiv>\n  <div class=\"level-grid\">\n    <div class=\"level-card\" style=\"border-left:3px solid #C13A2D\">\n      <div class=\"level-head\"><span class=\"badge badge-red\">Level 1<\u002Fspan>年处理 600 万笔以上<\u002Fdiv>\n      <div class=\"level-body\">QSA 现场审计，每年一次，费用¥50–150万/年。曾发生数据泄露的企业无论规模均适用。<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"level-card\" style=\"border-left:3px solid #8C5A11\">\n      <div class=\"level-head\"><span class=\"badge badge-amber\">Level 2<\u002Fspan>100万–600万笔<\u002Fdiv>\n      <div class=\"level-body\">SAQ 自评问卷 + QSA/ISA 签字确认 + 季度 ASV 漏洞扫描。适合中大型电商。<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"level-card\" style=\"border-left:3px solid #047857\">\n      <div class=\"level-head\"><span class=\"badge badge-green\">Level 3<\u002Fspan>2万–100万笔（仅电商）<\u002Fdiv>\n      <div class=\"level-body\">SAQ 自评 + 季度扫描，无需现场审计。适合年交易量中等的 DTC 品牌。<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"level-card\" style=\"border-left:3px solid #2E6DA4\">\n      <div class=\"level-head\"><span class=\"badge badge-blue\">Level 4<\u002Fspan>2万笔以下<\u002Fdiv>\n      <div class=\"level-body\">最简化 SAQ，使用 Stripe/Adyen 托管支付页面可缩小至此级别，合规成本接近零。<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"case-box teal\" style=\"margin-top:10px\">\n    <div class=\"case-label teal\">PCI 合规外包：为什么用 Stripe 只需 SAQ-A？<\u002Fdiv>\n    使用 Stripe Checkout 时，卡号直接由持卡人浏览器发送到 Stripe 服务器，商家服务器全程看不到卡号（去 Scope 化）。商家只需填写 SAQ-A（约22个问题），合规成本接近零。对比：自建系统存储卡号需 SAQ-D（约329个控制项）甚至 Level 1 现场审计。\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ════ 商业指标 ════ -->\n<div id=\"sec-biz\" class=\"section\">\n<h2 class=\"section-title\">商业指标<\u002Fh2>\n<p class=\"section-desc\">这些指标在支付和 Crypto 行业都通用，但在支付语境下有一些细节差异。<\u002Fp>\n\n<div class=\"card\">\n  <div class=\"card-title\">核心指标关系<\u002Fdiv>\n  <div class=\"chain\">\n    <div class=\"chain-node cn-blue\">TPV（总支付额）<\u002Fdiv><div class=\"chain-arrow\">×<\u002Fdiv>\n    <div class=\"chain-node cn-amber\">Take Rate（抽成）<\u002Fdiv><div class=\"chain-arrow\">=<\u002Fdiv>\n    <div class=\"chain-node cn-teal\">净收入<\u002Fdiv>\n  <\u002Fdiv>\n  <hr class=\"div\">\n  <div class=\"card-title\" style=\"margin-top:0\">GMV vs TPV — 平台与支付系统的差别<\u002Fdiv>\n  <div class=\"grid2\">\n    <div class=\"grid-card\"><div class=\"label\">GMV · Gross Merchandise Volume，总交易额<\u002Fdiv><div class=\"body\">平台上发生的商品/服务交易总额，<strong>包括所有支付方式<\u002Fstrong>（现金、银行转账、第三方支付等）。是电商平台的核心规模指标。<\u002Fdiv><\u002Fdiv>\n    <div class=\"grid-card\"><div class=\"label\">TPV · Total Payment Volume，总支付额<\u002Fdiv><div class=\"body\">其中经过<strong>平台自营支付系统<\u002Fstrong>的部分。不走平台支付通道的交易不计入。是支付公司估值的核心基准。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"case-box\">\n    <div class=\"case-label\">案例：Shopify GMV vs TPV<\u002Fdiv>\n    Shopify 的 GMV 是数千亿美元，但 TPV（Shopify Payments 处理的）只是 GMV 的一部分——很多商家用 Stripe 或 PayPal 接入，Shopify 收不到支付收入。投资人看支付公司用 TPV，看电商平台用 GMV。Take Rate 典型值：Stripe ~2.9%（Blended），Adyen ~0.3-0.5%（IC++）。\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">全量指标速查<\u002Fdiv>\n  <div class=\"term-grid\">\n    <div class=\"term-item\"><div class=\"term-abbr\">TPV<\u002Fdiv><div class=\"term-en\">Total Payment Volume，总支付额<\u002Fdiv><div class=\"term-zh\">平台处理的实际支付金额，支付公司估值的核心基准。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">GMV<\u002Fdiv><div class=\"term-en\">Gross Merchandise Volume，总交易额<\u002Fdiv><div class=\"term-zh\">平台上发生的商品/服务交易总额，包括所有支付方式。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">Take Rate<\u002Fdiv><div class=\"term-en\">抽成比例<\u002Fdiv><div class=\"term-zh\">净收入÷TPV，通常0.5%-3%。越高说明议价能力越强或增值服务越多。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">NRR<\u002Fdiv><div class=\"term-en\">Net Revenue Retention，净收入留存率<\u002Fdiv><div class=\"term-zh\">&gt;100%=扩张，=100%=平衡，&lt;100%=流失。支付公司因迁移成本高，NRR 天然偏高（常&gt;120%）。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">LTV / CAC<\u002Fdiv><div class=\"term-en\">Lifetime Value / Customer Acquisition Cost<\u002Fdiv><div class=\"term-zh\">LTV：客户整个生命周期贡献的总收入。CAC：获取一个新商户的总成本。LTV/CAC&gt;3 是健康标准。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">MRR / ARR<\u002Fdiv><div class=\"term-en\">Monthly / Annual Recurring Revenue<\u002Fdiv><div class=\"term-zh\">月/年经常性收入。ARR=MRR×12，投资人估值首要指标。支付公司主要收入是浮动的（TPV 相关），固定月费部分计入 MRR。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">ARPU<\u002Fdiv><div class=\"term-en\">Average Revenue Per User，每用户平均收入<\u002Fdiv><div class=\"term-zh\">总收入÷活跃用户数。C 端平台常用，高 ARPU=产品货币化能力强。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">PEPM<\u002Fdiv><div class=\"term-en\">Per Employee Per Month，每员工每月<\u002Fdiv><div class=\"term-zh\">HR/企业支付卡产品定价方式，按员工数收月费，随企业扩张自然增收（NDR 驱动）。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fmain>\n<\u002Fdiv>\n\n<script src=\"96aed00f-18fe-4691-b638-8e02c95fd200\"><\u002Fscript>\n<script src=\"f6a7c339-5929-41ab-a7b7-3da91c23b37d\"><\u002Fscript>\n<script>\nfunction show(id) {\n  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));\n  document.querySelectorAll('#sidebar a').forEach(a => a.classList.remove('active'));\n  document.getElementById('sec-' + id).classList.add('active');\n  event.currentTarget.classList.add('active');\n  window.scrollTo(0, 0);\n  return false;\n}\n\nconst REGION_META = {\n  americas:{ name:'美国 / 加拿大', color:'#2E6DA4',\n    items:[\n      {n:'MTL',d:'Money Transmitter License — 各州分别申请，48州+DC，2-3年，数百万成本，最难支付牌照'},\n      {n:'MSB',d:'Money Services Business — FinCEN联邦注册，14天完成，不等于牌照，仍需各州MTL'},\n      {n:'BitLicense',d:'NYDFS（纽约州）加密牌照 — 全美最严格，$5000申请费+律师费$100万+，审批2-3年'},\n      {n:'National Bank Charter',d:'OCC联邦银行牌照 — 可免除各州MTL要求，门槛极高（Cross River Bank案例）'},\n      {n:'FINTRAC MSB',d:'加拿大货币服务业务注册 — 相对容易，需年度合规报告'},\n    ]\n  },\n  latam:{ name:'拉丁美洲', color:'#5C4BB0',\n    items:[\n      {n:'PSP License（巴西BCB）',d:'开放银行体系，Pix实时支付已成全球模板，申请相对开放，外资需本地法人'},\n      {n:'PSSP（墨西哥CNBV）',d:'2018年金融科技法（Fintech Law）框架，拉美最重要数字支付牌照之一'},\n      {n:'PSP（阿根廷/哥 ment.getElementById('world-map');\n    el.style.display = 'block';\n    mapSvg = d3.select('#world-map');\n    const projection = d3.geoNaturalEarth1().scale(153).translate([480, 250]);\n    const pathGen = d3.geoPath().projection(projection);\n    mapSvg.append('rect').attr('width',960).attr('height',500).attr('fill','var(--bg2)');\n    mapSvg.append('path').datum({type:'Sphere'}).attr('d', pathGen).attr('fill','#DCEAF2').attr('opacity','0.5');\n    mapSvg.append('path').datum(d3.geoGraticule()()).attr('d', pathGen).attr('fill','none').attr('stroke','rgba(0,0,0,0.06)').attr('stroke-width','0.3');\n    const countries = topojson.feature(world, world.objects.countries);\n    mapSvg.selectAll('.country')\n      .data(countries.features)\n      .enter().append('path')\n      .attr('class','country')\n      .classed('clickable', d => !!COUNTRY_REGION[+d.id])\n      .attr('d', pathGen)\n      .attr('fill', d => { const r = COUNTRY_REGION[+d.id]; return r ? REGION_FILL[r] : 'var(--bg3)'; })\n      .on('click', function(event, d) { const r = COUNTRY_REGION[+d.id]; if (r) highlightRegion(r); })\n      .on('mouseover', function(event, d) { const r = COUNTRY_REGION[+d.id]; if (r) d3.select(this).attr('fill', REGION_HOVER[r]); })\n      .on('mouseout', function(event, d) { const r = COUNTRY_REGION[+d.id]; if (r) d3.select(this).attr('fill', currentRegion === r ? REGION_HOVER[r] : REGION_FILL[r]); });\n\n    const labels = [\n      {r:'americas',x:135,y:170,t:'北美',s:'MTL · BitLicense'},{r:'latam',x:200,y:315,t:'拉丁美洲',s:'PSP · Pix'},\n      {r:'europe',x:480,y:125,t:'欧洲',s:'EMI · MiCA'},{r:'apac',x:730,y:195,t:'亚太',s:'MPI · VATP'},\n      {r:'me',x:570,y:200,t:'中东',s:'VARA · FSRA'},{r:'africa',x:490,y:315,t:'非洲',s:'PSO · PSP'},\n    ];\n    labels.forEach(lp => {\n      const g = mapSvg.append('g').style('cursor','pointer').on('click', () => highlightRegion(lp.r));\n      g.append('text').attr('x',lp.x).attr('y',lp.y).attr('text-anchor','middle').attr('fill',REGION_HOVER[lp.r]).attr('font-size','11').attr('font-weight','600').attr('font-family','DM Sans, sans-serif').text(lp.t);\n      g.append('text').attr('x',lp.x).attr('y',lp.y+13).attr('text-anchor','middle').attr('fill',REGION_HOVER[lp.r]).attr('font-size','9').attr('opacity','0.8').attr('font-family','DM Mono, monospace').text(lp.s);\n    });\n  } catch(e) {\n    document.getElementById('loading-map').textContent = '地图数据加载失败，请检查网络连接后重试';\n    console.error(e);\n  }\n}\n\nfunction highlightRegion(r) {\n  currentRegion = r;\n  if (mapSvg) {\n    mapSvg.selectAll('.country').attr('fill', d => {\n      const cr = COUNTRY_REGION[+d.id];\n      if (!cr) return 'var(--bg3)';\n      return cr === r ? REGION_HOVER[cr] : REGION_FILL[cr];\n    });\n  }\n  const meta = REGION_META[r];\n  const titleEl = document.getElementById('map-tip-title');\n  titleEl.textContent = meta.name;\n  titleEl.style.color = meta.color;\n  document.getElementById('map-tip-items').innerHTML = meta.items.map(i =>\n    `<div class=\"map-tip-item\"><strong>${i.n}<\u002Fstrong> — ${i.d}<\u002Fdiv>`\n  ).join('');\n}\n\nif (document.readyState === 'loading') {\n  document.addEventListener('DOMContentLoaded', initMap);\n} else {\n  initMap();\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
