document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    if (e.filename && e.filename.indexOf('chrome-extension://') === 0) return;
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
    enhanceGlossaryNavigation();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

function enhanceGlossaryNavigation() {
  const slugById = {
    fund: 'fund-flow',
    card: 'card-acquiring',
    trade: 'trade-payments',
    fx: 'fx-cross-border',
    crypto: 'crypto-payments',
    ucard: 'crypto-card',
    comp: 'compliance',
    lic: 'licenses',
    stable: 'stablecoin-licenses',
    roles: 'institutional-roles',
    txlife: 'transaction-lifecycle',
    biz: 'business-metrics'
  };
  const idBySlug = Object.fromEntries(Object.entries(slugById).map(([id, slug]) => [slug, id]));
  const sections = Array.from(document.querySelectorAll('.section[id^="sec-"]'));
  const navLinks = Array.from(document.querySelectorAll('#sidebar a'));
  const anchorBySlug = {};
  const searchItems = [];
  const slugCounts = {};

  injectGlossaryEnhancementStyles();

  function normalize(text) {
    return (text || '').toLowerCase().replace(/\s+/g, ' ').trim();
  }

  function readableTitle(el, sectionTitle) {
    if (el.classList.contains('term-item')) {
      return [el.querySelector('.term-abbr'), el.querySelector('.term-en'), el.querySelector('.term-zh')]
        .map(node => node ? node.textContent.trim() : '')
        .filter(Boolean)
        .join(' · ');
    }
    const titleNode = el.querySelector('.card-title, .label, .level-head, .case-label, .section-title');
    return titleNode ? titleNode.textContent.replace(/\s+/g, ' ').trim() : sectionTitle;
  }

  function makeSlug(text, fallback) {
    const ascii = (text.match(/[A-Za-z0-9][A-Za-z0-9+&/ .-]*/g) || []).join(' ');
    const base = (ascii || fallback)
      .toLowerCase()
      .replace(/&/g, ' and ')
      .replace(/\+/g, ' plus ')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 48) || fallback;
    slugCounts[base] = (slugCounts[base] || 0) + 1;
    return slugCounts[base] === 1 ? base : base + '-' + slugCounts[base];
  }

  function setActiveSection(id, options = {}) {
    const section = document.getElementById('sec-' + id);
    if (!section) return false;
    sections.forEach(item => item.classList.remove('active'));
    navLinks.forEach(item => item.classList.remove('active'));
    section.classList.add('active');
    const activeLink = navLinks.find(link => link.dataset.sectionId === id);
    if (activeLink) activeLink.classList.add('active');

    const slug = slugById[id] || id;
    const targetSlug = options.target && options.target !== section ? options.target.dataset.glossaryAnchor : '';
    if (options.updateHash !== false) {
      const nextHash = '#' + slug + (targetSlug ? '/' + targetSlug : '');
      if (window.location.hash !== nextHash) history.pushState(null, '', nextHash);
    }

    const target = options.target || section;
    if (options.scroll !== false) {
      target.scrollIntoView({ behavior: options.instant ? 'auto' : 'smooth', block: 'start' });
    }
    if (options.target) {
      options.target.classList.remove('glossary-hit');
      void options.target.offsetWidth;
      options.target.classList.add('glossary-hit');
      window.setTimeout(() => options.target.classList.remove('glossary-hit'), 1600);
    }
    return true;
  }

  function parseSectionIdFromLink(link) {
    const raw = link.getAttribute('onclick') || '';
    const match = raw.match(/show\('([^']+)'\)/);
    return match ? match[1] : '';
  }

  navLinks.forEach(link => {
    const id = parseSectionIdFromLink(link);
    if (!id) return;
    link.dataset.sectionId = id;
    link.href = '#' + (slugById[id] || id);
    link.removeAttribute('onclick');
    link.addEventListener('click', event => {
      event.preventDefault();
      setActiveSection(id, { updateHash: true });
    });
  });

  sections.forEach(section => {
    const sectionId = section.id.replace(/^sec-/, '');
    const sectionSlug = slugById[sectionId] || sectionId;
    const sectionTitle = readableTitle(section, sectionId);
    const sectionAnchor = makeSlug(sectionTitle, sectionSlug);
    section.dataset.glossaryAnchor = sectionAnchor;
    anchorBySlug[sectionSlug] = section;
    searchItems.push({
      title: sectionTitle,
      context: '板块',
      text: normalize(section.innerText),
      sectionId,
      sectionSlug,
      targetSlug: sectionAnchor,
      target: section
    });

    Array.from(section.querySelectorAll('.term-item, .grid-card, .level-card, .card')).forEach((el, index) => {
      const title = readableTitle(el, sectionTitle);
      if (!title || title === sectionTitle) return;
      const targetSlug = makeSlug(title, sectionSlug + '-' + index);
      el.dataset.glossaryAnchor = targetSlug;
      anchorBySlug[sectionSlug + '/' + targetSlug] = el;
      searchItems.push({
        title,
        context: sectionTitle,
        text: normalize(el.innerText),
        sectionId,
        sectionSlug,
        targetSlug,
        target: el
      });
    });
  });

  window.show = function(id) {
    return setActiveSection(id, { updateHash: true });
  };

  function resolveHash() {
    const raw = decodeURIComponent(window.location.hash.replace(/^#/, ''));
    if (!raw) return null;
    const parts = raw.split('/').filter(Boolean);
    const sectionId = idBySlug[parts[0]] || (document.getElementById('sec-' + parts[0]) ? parts[0] : '');
    if (!sectionId) return null;
    const sectionSlug = slugById[sectionId] || sectionId;
    const target = parts[1] ? anchorBySlug[sectionSlug + '/' + parts[1]] : null;
    return { sectionId, target };
  }

  function routeFromHash(options = {}) {
    const route = resolveHash();
    if (!route) return setActiveSection('fund', { updateHash: false, scroll: false });
    return setActiveSection(route.sectionId, {
      target: route.target,
      updateHash: false,
      scroll: !!route.target,
      instant: options.instant
    });
  }

  function findMatches(query) {
    const q = normalize(query);
    if (!q) return [];
    return searchItems
      .map(item => {
        const title = normalize(item.title);
        let score = 0;
        if (title === q) score += 120;
        if (title.startsWith(q)) score += 80;
        if (title.includes(q)) score += 55;
        if (item.text.includes(q)) score += 20;
        return { ...item, score };
      })
      .filter(item => item.score > 0)
      .sort((a, b) => b.score - a.score || a.title.length - b.title.length)
      .slice(0, 8);
  }

  function addSearchBox() {
    const header = document.querySelector('header');
    const meta = document.querySelector('.header-meta');
    if (!header || document.querySelector('.glossary-search')) return;
    const form = document.createElement('form');
    form.className = 'glossary-search';
    form.setAttribute('role', 'search');
    form.innerHTML = `
      <div class="glossary-search-box">
        <span class="glossary-search-icon">⌕</span>
        <input type="search" autocomplete="off" spellcheck="false" placeholder="搜索术语，例如 TPV、COBO、PCI、稳定币">
      </div>
      <div class="glossary-search-results" aria-live="polite"></div>
    `;
    if (meta) meta.insertAdjacentElement('afterend', form);
    else header.appendChild(form);

    const input = form.querySelector('input');
    const results = form.querySelector('.glossary-search-results');
    let activeMatches = [];

    function render(matches) {
      activeMatches = matches;
      if (!input.value.trim()) {
        results.innerHTML = '';
        results.classList.remove('open');
        return;
      }
      if (!matches.length) {
        results.innerHTML = '<div class="glossary-search-empty">没有找到匹配术语</div>';
        results.classList.add('open');
        return;
      }
      results.innerHTML = matches.map((item, index) => `
        <button type="button" class="glossary-search-result" data-index="${index}">
          <span>${escapeHtml(item.title)}</span>
          <small>${escapeHtml(item.context)}</small>
        </button>
      `).join('');
      results.classList.add('open');
    }

    function jump(item) {
      if (!item) return;
      input.blur();
      results.classList.remove('open');
      input.value = item.title;
      setActiveSection(item.sectionId, { target: item.target, updateHash: true });
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      jump(activeMatches[0]);
    });
    input.addEventListener('input', () => render(findMatches(input.value)));
    input.addEventListener('focus', () => render(findMatches(input.value)));
    input.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        results.classList.remove('open');
        input.blur();
      }
    });
    results.addEventListener('click', event => {
      const button = event.target.closest('.glossary-search-result');
      if (!button) return;
      jump(activeMatches[Number(button.dataset.index)]);
    });
    document.addEventListener('click', event => {
      if (!form.contains(event.target)) results.classList.remove('open');
    });
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
  }

  addSearchBox();
  routeFromHash({ instant: true });
  window.addEventListener('hashchange', () => routeFromHash({ instant: true }));
}

function injectGlossaryEnhancementStyles() {
  if (document.getElementById('glossary-enhancement-styles')) return;
  const style = document.createElement('style');
  style.id = 'glossary-enhancement-styles';
  style.textContent = `
    .glossary-search {
      position: relative;
      max-width: 560px;
      margin-top: 22px;
    }
    .glossary-search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 0 14px;
    }
    .glossary-search-icon {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 18px;
      line-height: 1;
    }
    .glossary-search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: 14px/1.4 var(--sans);
    }
    .glossary-search input::placeholder { color: var(--text3); }
    .glossary-search-results {
      display: none;
      position: absolute;
      z-index: 30;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 12px 34px rgba(12,49,36,0.12);
    }
    .glossary-search-results.open { display: block; }
    .glossary-search-result {
      display: grid;
      gap: 3px;
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 11px 14px;
      text-align: left;
      font: 13px/1.35 var(--sans);
    }
    .glossary-search-result:last-child { border-bottom: 0; }
    .glossary-search-result:hover,
    .glossary-search-result:focus {
      background: var(--bg2);
      outline: 0;
    }
    .glossary-search-result small {
      color: var(--text2);
      font: 11px/1.3 var(--mono);
    }
    .glossary-search-empty {
      padding: 12px 14px;
      color: var(--text2);
      font: 13px/1.4 var(--sans);
    }
    .glossary-hit {
      animation: glossary-pulse 1.6s ease;
    }
    @keyframes glossary-pulse {
      0%, 100% { box-shadow: var(--shadow); }
      25% { box-shadow: 0 0 0 3px rgba(0,152,89,0.18), var(--shadow); }
    }
    @media (max-width: 720px) {
      .glossary-search { max-width: none; }
      .glossary-search-box { height: 42px; }
    }
  `;
  document.head.appendChild(style);
}

  </script>

         /* pure near-black */\n\n  /* brand / primary chrome (AllScale green) */\n  --accent: #009859;      /* brand green — active nav, eyebrows, abbr code, links */\n  --accent-hover: #0CAA67;\n  --accent2: #047857;     /* deep green text on light */\n\n  /* categorical palette — retuned to sit harmoniously with brand green */\n  --blue: #2E6DA4;   --blue2: #E8F0F8;\n  --teal: #0E7C6B;   --teal2: #E0F2EE;\n  --amber: #8C5A11;  --amber2: #F8EFDB;\n  --pink: #A6396A;   --pink2: #F9E8F0;\n  --purple: #5C4BB0; --purple2: #ECE9F8;\n  --red: #C13A2D;    --red2: #FAE8E6;\n  --green: #047857;  --green2: #E7F4EE;\n  --gray: #5C6B64;   --gray2: #ECF1EE;\n\n  --serif: 'Playfair Display', Georgia, serif;\n  --sans: 'Archivo', -apple-system, system-ui, sans-serif;\n  --mono: 'DM Mono', ui-monospace, monospace;\n  --radius: 12px;\n  --radius-lg: 18px;\n  --shadow: 0 1px 2px rgba(12,49,36,0.04), 0 4px 18px rgba(12,49,36,0.05);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  font-family: var(--sans);\n  background: var(--bg);\n  color: var(--text);\n  line-height: 1.6;\n  font-size: 15px;\n}\n\n/* ── Header ── */\nheader {\n  background: var(--surface);\n  border-bottom: 1px solid var(--border);\n  padding: 30px 48px 26px;\n}\n.header-top {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  margin-bottom: 22px;\n}\n.header-logo { height: 24px; width: auto; display: block; }\n.header-top-div { width: 1px; height: 18px; background: var(--border2); }\n.header-top-label {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: .04em;\n  color: var(--text2);\n}\n.header-eyebrow {\n  font-family: var(--mono);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  color: var(--accent);\n  margin-bottom: 12px;\n}\nheader h1 {\n  font-family: var(--serif);\n  font-size: 40px;\n  font-weight: 500;\n  color: var(--text);\n  line-height: 1.1;\n  letter-spacing: -0.01em;\n  max-width: 600px;\n}\nheader h1 em { font-style: italic; color: var(--accent); }\n.header-meta {\n  margin-top: 20px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  flex-wrap: wrap;\n}\n.header-badge {\n  background: var(--bg2);\n  border: 1px solid var(--border);\n  color: var(--text2);\n  border-radius: var(--radius-full);\n  padding: 5px 13px;\n  font-size: 12px;\n  font-family: var(--mono);\n}\n\n/* ── Layout ── */\n.layout {\n  display: flex;\n  min-height: calc(100vh - 140px);\n}\n\n/* ── Sidebar nav ── */\nnav {\n  width: 220px;\n  flex-shrink: 0;\n  background: var(--surface);\n  border-right: 1px solid var(--border);\n  padding: 24px 0;\n  position: sticky;\n  top: 0;\n  height: 100vh;\n  overflow-y: auto;\n}\n.nav-section-label {\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--text3);\n  padding: 0 20px;\n  margin: 16px 0 6px;\n}\n.nav-section-label:first-child { margin-top: 0; }\nnav a {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  padding: 8px 20px;\n  font-size: 13px;\n  color: var(--text2);\n  text-decoration: none;\n  border-left: 2px solid transparent;\n  transition: all .15s;\n  line-height: 1.3;\n}\nnav a:hover { background: var(--bg2); color: var(--text); border-left-color: var(--border2); }\nnav a.active { background: var(--bg2); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }\n.nav-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }\n\n/* ── Main content ── */\nmain {\n  flex: 1;\n  padding: 32px 48px;\n  max-width: 900px;\n  min-width: 0;\n}\n\n/* ── Section ── */\n.section { display: none; }\n.section.active { display: block; }\n\n.section-title {\n  font-family: var(--serif);\n  font-size: 28px;\n  font-weight: 500;\n  color: var(--text);\n  margin-bottom: 6px;\n}\n.section-desc {\n  font-size: 14px;\n  color: var(--text2);\n  margin-bottom: 24px;\n  line-height: 1.7;\n  max-width: 640px;\n}\n\n/* ── Card ── */\n.card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  padding: 20px 24px;\n  margin-bottom: 14px;\n  box-shadow: var(--shadow);\n}\n.card-title {\n  font-size: 15px;\n  font-weight: 500;\n  color: var(--text);\n  margin-bottom: 8px;\n}\n.card-title .abbr {\n  font-family: var(--mono);\n  font-size: 13px;\n  color: var(--accent);\n}\n.prose { font-size: 13px; line-height: 1.75; color: var(--text2); }\n.prose strong { color: var(--text); font-weight: 500; }\n\n/* ── Case box ── */\n.case-box {\n  background: var(--surface2);\n  border-left: 3px solid var(--accent);\n  border-radius: 0 var(--radius) var(--radius) 0;\n  padding: 12px 14px;\n  margin: 12px 0;\n  font-size: 13px;\n  line-height: 1.75;\n  color: var(--text);\n}\n.case-box.teal { border-left-color: var(--teal); }\n.case-box.amber { border-left-color: var(--amber); }\n.case-box.red { border-left-color: var(--red); }\n.case-label {\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  color: var(--accent);\n  margin-bottom: 4px;\n  font-weight: 600;\n}\n.case-label.teal { color: var(--teal); }\n.case-label.amber { color: var(--amber); }\n.case-label.red { color: var(--red); }\n\n/* ── Divider ── */\nhr.div { border: none; border-top: 1px solid var(--border); margin: 16px 0; }\n\n/* ── Grid ── */\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }\n.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }\n.grid-card {\n  background: var(--surface2);\n  border-radius: var(--radius);\n  padding: 12px 14px;\n  border: 1px solid var(--border);\n}\n.grid-card .label { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 4px; }\n.grid-card .body { font-size: 12px; color: var(--text2); line-height: 1.6; }\n.grid-card .body strong { color: var(--text); font-weight: 500; }\n\n/* ── Term grid ── */\n.term-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }\n.term-item {\n  background: var(--surface2);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  padding: 10px 13px;\n  flex: 1;\n  min-width: 160px;\n}\n.term-abbr { font-size: 13px; font-weight: 500; color: var(--text); font-family: var(--mono); }\n.term-en { font-size: 11px; color: var(--text3); margin-top: 2px; }\n.term-zh { font-size: 12px; color: var(--text2); margin-top: 4px; line-height: 1.5; }\n\n/* ── Highlight ── */\n.hl { background: var(--amber2); color: var(--amber); border-radius: 3px; padding: 0 3px; font-weight: 500; }\n.hlb { background: var(--blue2); color: var(--blue); border-radius: 3px; padding: 0 3px; }\n.hlg { background: var(--green2); color: var(--green); border-radius: 3px; padding: 0 3px; }\n.hlr { background: var(--red2); color: var(--red); border-radius: 3px; padding: 0 3px; }\n.hlp { background: var(--purple2); color: var(--purple); border-radius: 3px; padding: 0 3px; }\n\n/* ── Badge ── */\n.badge {\n  display: inline-block;\n  font-family: var(--mono);\n  font-size: 11px;\n  padding: 2px 8px;\n  border-radius: 8px;\n  font-weight: 500;\n  margin-right: 4px;\n}\n.badge-blue { background: var(--blue2); color: var(--blue); }\n.badge-teal { background: var(--teal2); color: var(--teal); }\n.badge-amber { background: var(--amber2); color: var(--amber); }\n.badge-pink { background: var(--pink2); color: var(--pink); }\n.badge-gray { background: var(--gray2); color: var(--gray); }\n.badge-red { background: var(--red2); color: var(--red); }\n.badge-purple { background: var(--purple2); color: var(--purple); }\n.badge-green { background: var(--green2); color: var(--green); }\n\n/* ── Chain row ── */\n.chain { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 8px 0; }\n.chain-node {\n  border-radius: var(--radius);\n  padding: 6px 11px;\n  font-size: 12px;\n  font-weight: 500;\n  white-space: nowrap;\n  line-height: 1.3;\n  text-align: center;\n}\n.cn-blue { background: var(--blue2); color: var(--blue); }\n.cn-teal { background: var(--teal2); color: var(--teal); }\n.cn-amber { background: var(--amber2); color: var(--amber); }\n.cn-green { background: var(--green2); color: var(--green); }\n.cn-pink { background: var(--pink2); color: var(--pink); }\n.cn-gray { background: var(--gray2); color: var(--gray); }\n.cn-red { background: var(--red2); color: var(--red); }\n.cn-purple { background: var(--purple2); color: var(--purple); }\n.chain-arrow { color: var(--text3); font-size: 14px; flex-shrink: 0; }\n\n/* ── Steps ── */\n.step { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }\n.step-num {\n  width: 22px; height: 22px; border-radius: 50%;\n  background: var(--blue2); color: var(--blue);\n  font-size: 11px; font-weight: 500;\n  display: flex; align-items: center; justify-content: center;\n  flex-shrink: 0; margin-top: 2px;\n  font-family: var(--mono);\n}\n.step-num.amber { background: var(--amber2); color: var(--amber); }\n.step-num.red { background: var(--red2); color: var(--red); }\n.step-num.green { background: var(--green2); color: var(--green); }\n.step-body { font-size: 13px; line-height: 1.7; color: var(--text2); flex: 1; }\n.step-body strong { color: var(--text); font-weight: 500; }\n\n/* ── Table ── */\n.tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }\n.tbl th {\n  text-align: left; font-weight: 600; padding: 7px 9px;\n  border-bottom: 1px solid var(--border2);\n  color: var(--text); font-size: 12px; background: var(--surface2);\n}\n.tbl td { padding: 6px 9px; border-bottom: 1px solid var(--border); color: var(--text2); vertical-align: top; }\n.tbl tr:last-child td { border-bottom: none; }\n.tbl tr:hover td { background: var(--bg2); }\n\n/* ── Section label ── */\n.slabel {\n  font-family: var(--mono);\n  font-size: 10px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--text3);\n  margin: 18px 0 8px;\n  padding-bottom: 6px;\n  border-bottom: 1px solid var(--border);\n}\n\n/* ── Level cards ── */\n.level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }\n.level-card { border-radius: var(--radius); padding: 11px 13px; border: 1px solid var(--border); }\n.level-head { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }\n.level-body { font-size: 12px; color: var(--text2); line-height: 1.6; }\n\n/* ── Role card ── */\n.role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }\n.role-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }\n.role-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }\n.role-badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 8px; font-family: var(--mono); }\n.role-title { font-size: 13px; font-weight: 500; color: var(--text); }\n.role-body { font-size: 12px; line-height: 1.65; color: var(--text2); }\n.role-body strong { color: var(--text); font-weight: 500; }\n\n/* ── SVG diagram container ── */\n.diagram { width: 100%; overflow: hidden; border-radius: var(--radius); margin: 12px 0; background: var(--surface2); }\n.diagram svg { width: 100%; height: auto; display: block; }\n\n/* ── World map ── */\n#map-svg { width: 100%; height: auto; display: block; background: var(--bg2); border-radius: var(--radius); }\n.country { stroke: var(--surface); stroke-width: 0.4; transition: opacity .12s; cursor: default; }\n.country.clickable { cursor: pointer; }\n.country.clickable:hover { opacity: 0.75; }\n.map-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }\n.map-leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text2); cursor: pointer; padding: 3px 8px; border-radius: 20px; border: 1px solid transparent; transition: all .15s; }\n.map-leg:hover { background: var(--bg2); border-color: var(--border); }\n.map-leg-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }\n.map-tip {\n  background: var(--surface);\n  border: 1px solid var(--border2);\n  border-radius: var(--radius-lg);\n  padding: 14px 16px;\n  margin-top: 10px;\n  min-height: 60px;\n  box-shadow: var(--shadow);\n}\n.map-tip-title { font-size: 13px; font-weight: 500; margin-bottom: 8px; }\n.map-tip-items { display: flex; flex-direction: column; gap: 5px; }\n.map-tip-item { background: var(--surface2); border-radius: var(--radius); padding: 7px 10px; font-size: 12px; color: var(--text2); line-height: 1.55; }\n.map-tip-item strong { color: var(--text); font-weight: 500; font-family: var(--mono); font-size: 11px; }\n\n/* ── Warn box ── */\n.warn-box {\n  background: var(--amber2);\n  border-left: 3px solid var(--amber);\n  border-radius: 0 var(--radius) var(--radius) 0;\n  padding: 11px 14px;\n  margin: 10px 0;\n  font-size: 13px;\n  color: var(--amber);\n  line-height: 1.7;\n}\n.warn-box strong { color: var(--amber); font-weight: 500; }\n\n/* ── Scrollbar ── */\n::-webkit-scrollbar { width: 6px; }\n::-webkit-scrollbar-track { background: transparent; }\n::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }\n\n/* ── Responsive ── */\n@media (max-width: 768px) {\n  .layout { flex-direction: column; }\n  nav { width: 100%; height: auto; position: static; display: flex; flex-wrap: wrap; padding: 12px; gap: 4px; border-right: none; border-bottom: 1px solid var(--border); }\n  nav a { border-left: none; border-radius: 20px; padding: 5px 12px; font-size: 12px; }\n  nav a.active { background: var(--accent); color: #fff; }\n  .nav-section-label { display: none; }\n  main { padding: 20px 16px; }\n  header { padding: 24px 20px; }\n  header h1 { font-size: 26px; }\n  .grid2, .role-grid, .level-grid { grid-template-columns: 1fr; }\n  .grid3 { grid-template-columns: 1fr 1fr; }\n}\n\n@media print {\n  nav { display: none; }\n  main { padding: 20px; max-width: 100%; }\n  .section { display: block !important; page-break-before: always; }\n  .section:first-child { page-break-before: auto; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header>\n  <div class=\"header-top\">\n    <img class=\"header-logo\" src=\"5f85a5ac-a29c-4fc3-aa77-2268e7222590\" alt=\"AllScale\">\n    <div class=\"header-top-div\"><\u002Fdiv>\n    <span class=\"header-top-label\">Checkout · Knowledge Base<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"header-eyebrow\">Payments Reference<\u002Fdiv>\n  <h1>支付行业<em>术语手册<\u002Fem><\u002Fh1>\n  <div class=\"header-meta\">\n    <span class=\"header-badge\">v3.0 · 2026年3月<\u002Fspan>\n    <span class=\"header-badge\">12 模块 · 200+ 术语<\u002Fspan>\n    <span class=\"header-badge\">面向 Crypto 从业者<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div class=\"layout\">\n\n<nav id=\"sidebar\">\n  <div class=\"nav-section-label\">基础架构<\u002Fdiv>\n  <a href=\"#\" onclick=\"show('fund')\" class=\"active\"><span class=\"nav-dot\" style=\"background:#2E6DA4\"><\u002Fspan>资金流转<\u002Fa>\n  <a href=\"#\" onclick=\"show('card')\"><span class=\"nav-dot\" style=\"background:#2E6DA4\"><\u002Fspan>收单与商户<\u002Fa>\n  <a href=\"#\" onclick=\"show('trade')\"><span class=\"nav-dot\" style=\"background:#2E6DA4\"><\u002Fspan>贸易支付<\u002Fa>\n  <a href=\"#\" onclick=\"show('fx')\"><span class=\"nav-dot\" style=\"background:#2E6DA4\"><\u002Fspan>跨境外汇<\u002Fa>\n  <div class=\"nav-section-label\">Crypto<\u002Fdiv>\n  <a href=\"#\" onclick=\"show('crypto')\"><span class=\"nav-dot\" style=\"background:#0E7C6B\"><\u002Fspan>Crypto 支付<\u002Fa>\n  <a href=\"#\" onclick=\"show('ucard')\"><span class=\"nav-dot\" style=\"background:#0E7C6B\"><\u002Fspan>加密 U 卡<\u002Fa>\n  <div class=\"nav-section-label\">合规 &amp; 监管<\u002Fdiv>\n  <a href=\"#\" onclick=\"show('comp')\"><span class=\"nav-dot\" style=\"background:#A6396A\"><\u002Fspan>合规监管<\u002Fa>\n  <a href=\"#\" onclick=\"show('lic')\"><span class=\"nav-dot\" style=\"background:#A6396A\"><\u002Fspan>牌照地图<\u002Fa>\n  <a href=\"#\" onclick=\"show('stable')\"><span class=\"nav-dot\" style=\"background:#A6396A\"><\u002Fspan>稳定币牌照<\u002Fa>\n  <div class=\"nav-section-label\">机构 &amp; 运营<\u002Fdiv>\n  <a href=\"#\" onclick=\"show('roles')\"><span class=\"nav-dot\" style=\"background:#8C5A11\"><\u002Fspan>机构角色<\u002Fa>\n  <a href=\"#\" onclick=\"show('txlife')\"><span class=\"nav-dot\" style=\"background:#8C5A11\"><\u002Fspan>交易生命周期<\u002Fa>\n  <a href=\"#\" onclick=\"show('biz')\"><span class=\"nav-dot\" style=\"background:#8C5A11\"><\u002Fspan>商业指标<\u002Fa>\n<\u002Fnav>\n\n<main>\n\n<!-- ════ 资金流转 ════ -->\n<div id=\"sec-fund\" class=\"section active\">\n<h2 class=\"section-title\">资金流转<\u002Fh2>\n<p class=\"section-desc\">钱怎么从 A 流向 B。从代收代付到跨境清算，这是支付行业的骨架。<\u002Fp>\n\n<div class=\"card\">\n  <div class=\"card-title\"><span class=\"abbr\">COBO + POBO<\u002Fspan> — 代收 + 代付（组合理解）<\u002Fdiv>\n  <div class=\"grid2\">\n    <div class=\"grid-card\"><div class=\"label\">COBO · Collection On Behalf Of · 代收<\u002Fdiv><div class=\"body\">A 公司帮 B 公司<strong>收款<\u002Fstrong>。客户的钱先进 A 账户，平台记在 B 名下，定期划转。<\u002Fdiv><\u002Fdiv>\n    <div class=\"grid-card\"><div class=\"label\">POBO · Payment On Behalf Of · 代付<\u002Fdiv><div class=\"body\">A 公司帮 B 公司<strong>付款<\u002Fstrong>。资金从 A 账户出，账面以 B 公司名义支付给供应商。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"case-box\">\n    <div class=\"case-label\">案例：欧洲零售集团资金池<\u002Fdiv>\n    德国、法国、波兰子公司的客户付款统一汇入英国总部（COBO），所有供应商货款由总部统一对外支付（POBO）。好处：①银行费用集中降低；②外汇风险统一对冲；③总部实时掌握集团资金头寸。<br><br>\n    <strong>Crypto 类比：<\u002Fstrong>交易所 Omnibus 钱包——多用户资金汇入一个链上地址，用户看到虚拟余额，实际是 COBO 逻辑。\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">Clearing（清算）vs Settlement（结算）vs Netting（轧差）<\u002Fdiv>\n  <div class=\"chain\">\n    <div class=\"chain-node cn-gray\">交易发生<\u002Fdiv><div class=\"chain-arrow\">→<\u002Fdiv>\n    <div class=\"chain-node cn-amber\">Clearing 清算<br><small style=\"font-weight:400;font-size:10px\">数据对账·轧差净额<\u002Fsmall><\u002Fdiv><div class=\"chain-arrow\">→<\u002Fdiv>\n    <div class=\"chain-node cn-teal\">Settlement 结算<br><small style=\"font-weight:400;font-size:10px\">资金实际划转<\u002Fsmall><\u002Fdiv><div class=\"chain-arrow\">→<\u002Fdiv>\n    <div class=\"chain-node cn-green\">T+0/1/2 到账<\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"prose\" style=\"margin-top:6px\"><strong>Netting（轧差）：<\u002Fstrong>银行 A 欠 B 1000万，B 欠 A 800万 → 只净转200万，极大压缩系统内资金流动量。<br>\n  <strong>Float（在途资金）：<\u002Fstrong>已发起但尚未到账的资金。Paypal 早期靠持有用户 Float 赚取利息。<br>\n  <strong>Escrow（第三方托管）：<\u002Fstrong>资金由中立第三方持有，满足条件后释放。智能合约是 Escrow 的链上去信任版本。<\u002Fp>\n  <div class=\"case-box teal\">\n    <div class=\"case-label teal\">Crypto 对比<\u002Fdiv>链上出块即结算，没有清算层，天然 T+0。这也是稳定币支付最有力的进攻点——传统跨境汇款中转行每跳收费、产生 Float、延误1-2天，稳定币压缩成1笔链上交易。\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">跨境结算系统速查<\u002Fdiv>\n  <div class=\"term-grid\">\n    <div class=\"term-item\"><div class=\"term-abbr\">SWIFT<\u002Fdiv><div class=\"term-en\">Society for Worldwide Interbank Financial Telecommunication<\u002Fdiv><div class=\"term-zh\">跨境转账报文系统，用 BIC 识别银行。T+1至T+5，每跳收费。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">RTGS<\u002Fdiv><div class=\"term-en\">Real-Time Gross Settlement，实时全额结算<\u002Fdiv><div class=\"term-zh\">大额资金逐笔即时结算，如美国 Fedwire、中国大额支付系统。T+0。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">ACH<\u002Fdiv><div class=\"term-en\">Automated Clearing House，自动清算所<\u002Fdiv><div class=\"term-zh\">美国批量电子转账系统，T+1，适合工资发放、账单付款。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">SEPA<\u002Fdiv><div class=\"term-en\">Single Euro Payments Area，欧洲统一支付区<\u002Fdiv><div class=\"term-zh\">EU 法规规定：欧盟内欧元跨境转账不能比本地收更高费用，同一套报文格式（ISO 20022），T+1，与本地转账体验完全一致。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">FPS<\u002Fdiv><div class=\"term-en\">Faster Payment System<\u002Fdiv><div class=\"term-zh\">英国和香港各有同名实时支付系统，秒级到账。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">BACS<\u002Fdiv><div class=\"term-en\">Bankers' Automated Clearing Services<\u002Fdiv><div class=\"term-zh\">英国批量清算，处理直接借记和工资发放，T+3。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">IBAN<\u002Fdiv><div class=\"term-en\">International Bank Account Number<\u002Fdiv><div class=\"term-zh\">欧洲及中东标准化账号，最多34位字符，含国家码+校验码+本地账号。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">Wire / TT<\u002Fdiv><div class=\"term-en\">Wire Transfer / Telegraphic Transfer，电汇<\u002Fdiv><div class=\"term-zh\">两者基本同义。TT 在亚洲更常用，通常当日或次日到账。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">Nostro / Vostro<\u002Fdiv><div class=\"term-en\">代理行双向账户<\u002Fdiv><div class=\"term-zh\">Nostro：本行在他行的账户（\"我的\"）。Vostro：他行在本行的账户（\"你的\"）。传统跨境汇款通过多家代理行（Correspondent Banking）中转。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ════ 收单与商户 ════ -->\n<div id=\"sec-card\" class=\"section\">\n<h2 class=\"section-title\">收单与商户<\u002Fh2>\n<p class=\"section-desc\">一笔刷卡背后至少有5个角色。理解这张关系图，是看懂支付行业商业模式的前提。<\u002Fp>\n\n<div class=\"card\">\n  <div class=\"card-title\">一笔刷卡的完整链条（逐步拆解）<\u002Fdiv>\n  <p class=\"prose\" style=\"margin-bottom:10px\">以\"在 Shopify 独立站刷 Visa 信用卡购买 $100 商品\"为例。<\u002Fp>\n  <div class=\"step\"><div class=\"step-num\">1<\u002Fdiv><div class=\"step-body\"><strong>用户输入卡号/CVV，点击 Pay。<\u002Fstrong>浏览器将卡数据加密后发给 Gateway（支付网关）。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">2<\u002Fdiv><div class=\"step-body\"><strong>Gateway 执行 Tokenization（令牌化）<\u002Fstrong>，用随机 Token 替代真实卡号，将 Auth 请求路由给 Acquirer（收单行）。纯数据管道，不碰资金。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">3<\u002Fdiv><div class=\"step-body\"><strong>Acquirer 通过 Visa 网络（Scheme）<\u002Fstrong>将授权请求路由给发卡行（Issuer）。走的是 Visa 的 IP 网络，非 SWIFT。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">4<\u002Fdiv><div class=\"step-body\"><strong>Issuer（发卡行）<\u002Fstrong>验证余额、CVV、风控模型 → 若通过，返回授权码并<span class=\"hl\">冻结 $100 额度<\u002Fspan>（非真正扣款）。约1-3秒。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">5<\u002Fdiv><div class=\"step-body\"><strong>授权码原路返回<\u002Fstrong> → 用户看到\"支付成功\"。此时资金仅被预留，尚未转移。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">6<\u002Fdiv><div class=\"step-body\"><strong>Capture（请款）：<\u002Fstrong>商家发货后触发正式扣款。若取消则发 Void（撤销，无费用，对 CBR 无影响）。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">7<\u002Fdiv><div class=\"step-body\"><strong>Clearing（清算）：<\u002Fstrong>当晚 Visa 汇总所有 Capture，银行间互相欠款 Netting 轧差成净额。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num green\">8<\u002Fdiv><div class=\"step-body\"><strong>Settlement（结算）T+2：<\u002Fstrong>发卡行向收单行划拨净额，商家扣 MDR 后实收约 <span class=\"hlg\">$97–98<\u002Fspan>。<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">费率结构：<span class=\"abbr\">MDR = IC + Scheme fee + Markup<\u002Fspan><\u002Fdiv>\n  <div class=\"case-box teal\">\n    <div class=\"case-label teal\">核心公式<\u002Fdiv>\n    MDR（Merchant Discount Rate，商户折扣率）= IC（Interchange Fee，交换费）+ Scheme fee（卡组织费）+ Acquirer Markup（收单行加价）<br><br>\n    <strong>Markup 的功能：<\u002Fstrong>Acquirer 在 IC 和 Scheme 费之上加收的利润，覆盖运营成本、风险拨备（Chargeback 损失）、销售佣金。\n  <\u002Fdiv>\n  <div class=\"grid2\">\n    <div class=\"grid-card\"><div class=\"label\">Blended Rate（混合费率）<\u002Fdiv><div class=\"body\">MDR 的打包定价形式，如 Stripe 2.9%+$0.30。理解简单，但实际成本因卡类型而异，高端信用卡 IC 更高，商家实际成本不稳定。<\u002Fdiv><\u002Fdiv>\n    <div class=\"grid-card\"><div class=\"label\">IC++（成本加成定价）<\u002Fdiv><div class=\"body\">IC 实际值 + Scheme 费 + 固定 Markup，透明分项。月交易量大的商家用 IC++ 更合算。Amazon 等大商家直接与 Visa 谈 IC 费率。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">安全与认证<\u002Fdiv>\n  <div class=\"term-grid\">\n    <div class=\"term-item\"><div class=\"term-abbr\">Tokenization（令牌化）<\u002Fdiv><div class=\"term-zh\">真实卡号→随机 Token，商家只存 Token。Apple Pay、Google Pay 均基于此。即使数据库泄露，黑客拿到的也是无效 Token。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">3DS2<\u002Fdiv><div class=\"term-en\">3-D Secure 2.0，线上支付额外验证<\u002Fdiv><div class=\"term-zh\">风控评分低→Frictionless Flow 无感通过；高风险→触发 Challenge 要求短信/Face ID 验证（即 SCA）。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">SCA<\u002Fdiv><div class=\"term-en\">Strong Customer Authentication，强客户认证<\u002Fdiv><div class=\"term-zh\">PSD2 要求的双因素认证：知道的+拥有的+本人生物特征，三选二。支付宝密码+设备绑定即是此逻辑。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">BIN / IIN<\u002Fdiv><div class=\"term-en\">Bank/Issuer Identification Number，发卡行识别码<\u002Fdiv><div class=\"term-zh\">卡号前6-8位，识别发卡行、卡类型、卡级别、发行国。影响 IC 费率和风险评估。Crypto 类比：链上地址前缀。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">AVS<\u002Fdiv><div class=\"term-en\">Address Verification System，地址验证系统<\u002Fdiv><div class=\"term-zh\">核对账单地址与发卡行记录。美国电商常用，欧洲因有 SCA 较少使用。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">CVV / CVC<\u002Fdiv><div class=\"term-en\">Card Verification Value/Code，卡安全码<\u002Fdiv><div class=\"term-zh\">卡背面3位（Amex正面4位）。链上支付无等价物，是传统卡身份验证的独特安全层。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">PCI DSS<\u002Fdiv><div class=\"term-en\">Payment Card Industry Data Security Standard<\u002Fdiv><div class=\"term-zh\">任何接触卡数据的系统都必须满足的强制安全认证。4个等级按年交易量划分，使用 Stripe 托管页面可将商家合规成本降至接近零。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"case-box\">\n    <div class=\"case-label\">Chargeback（拒付）全流程<\u002Fdiv>\n    持卡人投诉 → Issuer 冻结 → Acquirer 通知商家（30天提交证据）→ Scheme 仲裁 → 资金扣回+罚款。<br>\n    CBR（Chargeback Rate，拒付率）超过1%触发卡组织预警，超2%终止商户资格。<br>\n    RDR（Rapid Dispute Resolution）：Visa 自动化方案，在争议升级前自动退款，商家损失钱但 CBR 数字不增加。\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ════ 贸易支付 ════ -->\n<div id=\"sec-trade\" class=\"section\">\n<h2 class=\"section-title\">贸易支付<\u002Fh2>\n<p class=\"section-desc\">跨国贸易中的支付工具，每种工具背后是不同的风险分配方式。<\u002Fp>\n\n<div class=\"card\">\n  <div class=\"card-title\">LC / D/P / D/A 对比<\u002Fdiv>\n  <table class=\"tbl\">\n    <tbody><tr><th>工具<\u002Fth><th>全称<\u002Fth><th>付款时间<\u002Fth><th>风险承担<\u002Fth><th>适用场景<\u002Fth><\u002Ftr>\n    <tr><td><span class=\"badge badge-blue\">LC<\u002Fspan><\u002Ftd><td>Letter of Credit，信用证<\u002Ftd><td>单据无误后银行即付<\u002Ftd><td>银行担保，最低风险<\u002Ftd><td>大额首次合作，买方信用未知<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-teal\">D/P<\u002Fspan><\u002Ftd><td>Documents against Payment，付款交单<\u002Ftd><td>买方付款后拿单据<\u002Ftd><td>卖方较安全<\u002Ftd><td>中等信任，卖方希望快速回款<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-amber\">D/A<\u002Fspan><\u002Ftd><td>Documents against Acceptance，承兑交单<\u002Ftd><td>买方签承兑汇票后拿货，到期再付<\u002Ftd><td>卖方承担买方信用风险<\u002Ftd><td>买方强势或双方长期合作<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n  <div class=\"case-box amber\">\n    <div class=\"case-label amber\">为什么有人选择 D/A？<\u002Fdiv>\n    D/A 本质是卖方用资金风险换市场准入。以下情况买方会主导要求 D/A：①买方是大客户，议价能力强（如沃尔玛）；②商品是不易腐烂的工业品，卖方愿意承担短期敞口换大订单；③买方所在市场外汇管制严格，必须先拿货才能操作付款；④双方长期合作，卖方以信用期维系竞争力。D/A ≠ D/P 的退而求其次，它是一种商务策略工具。\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">LC 信用证完整流程（7步）<\u002Fdiv>\n  <div class=\"case-box teal\">\n    <div class=\"case-label teal\">关键点：LC 必须在发货前开立<\u002Fdiv>\n    LC 是银行先担保付款，工厂才安排发货——不是发完货再去要 LC。\n  <\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">1<\u002Fdiv><div class=\"step-body\"><strong>买卖双方签合同，约定 LC 结算。<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">2<\u002Fdiv><div class=\"step-body\"><strong>超市向开证行（大通银行）申请开立 LC，<\u002Fstrong>大通审核超市资信后开出 LC。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">3<\u002Fdiv><div class=\"step-body\"><strong>开证行发 LC 给通知行（中信银行），<\u002Fstrong>中信通知工厂\"LC 已到位，可安排发货\"。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">4<\u002Fdiv><div class=\"step-body\"><strong>工厂发货，取得货运单据<\u002Fstrong>（提单、装箱单、发票等）。工厂也可凭 LC 向中信申请融资，不用等最终货款。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">5<\u002Fdiv><div class=\"step-body\"><strong>工厂将单据交中信审核，<\u002Fstrong>确认与 LC 条款完全相符（单证相符）。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">6<\u002Fdiv><div class=\"step-body\"><strong>中信向大通索款，<\u002Fstrong>大通审核单据无误后付款给中信，中信转给工厂。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num green\">7<\u002Fdiv><div class=\"step-body\"><strong>大通凭单据通知超市赎单，<\u002Fstrong>超市还款给大通，凭单据提货。<\u002Fdiv><\u002Fdiv>\n  <div class=\"case-box\">\n    <div class=\"case-label\">Crypto RWA 化方向<\u002Fdiv>\n    LC 上链后，智能合约作为仲裁方。海关 API 传入\"货物清关成功\"数据，合约自动释放 USDC——无需银行人工审单，T+0 结算。\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">贸易术语补充<\u002Fdiv>\n  <div class=\"term-grid\">\n    <div class=\"term-item\"><div class=\"term-abbr\">Beneficiary<\u002Fdiv><div class=\"term-en\">收款方<\u002Fdiv><div class=\"term-zh\">资金最终接收者。LC 中通常指出口商（卖家）。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">Remitter<\u002Fdiv><div class=\"term-en\">汇款方<\u002Fdiv><div class=\"term-zh\">资金发送者。SWIFT 报文中 Remitter 信息是反洗钱审查的核心字段。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">Escrow<\u002Fdiv><div class=\"term-en\">第三方托管<\u002Fdiv><div class=\"term-zh\">资金由中立第三方持有，满足合同条件后自动释放。智能合约是 Escrow 的链上去信任版本。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">Remittance<\u002Fdiv><div class=\"term-en\">汇款<\u002Fdiv><div class=\"term-zh\">特指跨境个人汇款，如海外务工者寄钱回家。Wise、Western Union 主做此市场。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ════ 跨境外汇 ════ -->\n<div id=\"sec-fx\" class=\"section\">\n<h2 class=\"section-title\">跨境外汇<\u002Fh2>\n<p class=\"section-desc\">理解外汇成本是跨境支付业务的核心。很多\"免手续费\"的产品，利润隐藏在汇率差价里。<\u002Fp>\n\n<div class=\"card\">\n  <div class=\"card-title\">Mid-market Rate vs Spread — 谁有定价权？<\u002Fdiv>\n  <div class=\"case-box teal\">\n    <div class=\"case-label teal\">核心公式<\u002Fdiv>\n    用户实际汇率 = Mid-market Rate（中间汇率）± Spread（差价）<br>机构利润 = Spread × 换汇金额\n  <\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num amber\">1<\u002Fdiv><div class=\"step-body\"><strong>传统银行（0.5%–3%）：<\u002Fstrong>Nostro 账户管理+汇率对冲成本，但核心原因是<span class=\"hl\">信息不透明<\u002Fspan>——用户不知道真实中间汇率，银行可以\"随意定价\"。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num amber\">2<\u002Fdiv><div class=\"step-body\"><strong>Wise/Airwallex（0.2%–0.6%）：<\u002Fstrong>通过<span class=\"hlg\">本地对冲<\u002Fspan>降低成本——在两个国家各维护本地账户，英国用户的英镑和美国收款方的美元需求互相匹配，真正的跨境资金流动最小化。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num amber\">3<\u002Fdiv><div class=\"step-body\"><strong>CEX（0.1%–0.5%）：<\u002Fstrong>大量交易者在平台买卖，流动性深，订单簿撮合成本低。OTC 大额（$100万+）可谈到更低。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num amber\">4<\u002Fdiv><div class=\"step-body\"><strong>稳定币（趋近0）：<\u002Fstrong>USDC 跨境\"换汇\"变成接收 USDC 后在本地 Off-ramp，只要有竞争性的 Off-ramp，综合成本接近零。<\u002Fdiv><\u002Fdiv>\n  <p class=\"prose\" style=\"margin-top:8px\"><strong>定价权来源：<\u002Fstrong>流动性规模、信息透明度、本地资金匹配能力、监管合规成本。机构能提供的流动性越深、信息越透明，Spread 就越窄。<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">Virtual Account / Multi-currency / SAFE<\u002Fdiv>\n  <div class=\"term-grid\">\n    <div class=\"term-item\"><div class=\"term-abbr\">Virtual Account<\u002Fdiv><div class=\"term-en\">虚拟账户<\u002Fdiv><div class=\"term-zh\">银行主账户下的子账户，各有独立账号，资金自动归集。给客户一个\"当地账号\"，实际落在主账户。中国 SaaS 公司向美国收款的标准方案。Crypto 类比：交易所给每个用户分配的独立充值地址。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">Multi-currency<\u002Fdiv><div class=\"term-en\">多币种账户<\u002Fdiv><div class=\"term-zh\">一个账户持有多个币种余额，可内部换汇。Crypto 类比：CEX 资产账户持有 BTC/ETH/USDC 多资产，内部划转即时。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">SAFE<\u002Fdiv><div class=\"term-en\">国家外汇管理局，State Administration of Foreign Exchange<\u002Fdiv><div class=\"term-zh\">中国外汇监管核心机构。单笔个人换汇超等值 $50,000 需申报。外资进入中国收款，SAFE 合规是第一道关。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ════ Crypto支付 ════ -->\n<div id=\"sec-crypto\" class=\"section\">\n<h2 class=\"section-title\">Crypto 支付<\u002Fh2>\n<p class=\"section-desc\">这一节是你的主场——但从支付角度重新看这些术语，会发现很多新的维度。<\u002Fp>\n\n<div class=\"card\">\n  <div class=\"card-title\">On-ramp &amp; Off-ramp 及相关牌照<\u002Fdiv>\n  <div class=\"grid2\">\n    <div class=\"grid-card\"><div class=\"label\">On-ramp：法币→Crypto<\u002Fdiv><div class=\"body\">用信用卡/银行转账购买 USDC。服务商需处理支付路由、反欺诈、汇率，同时承担 MDR 成本。<\u002Fdiv><\u002Fdiv>\n    <div class=\"grid-card\"><div class=\"label\">Off-ramp：Crypto→法币<\u002Fdiv><div class=\"body\">商家收 USDC 后换成本币入账。需要当地银行账号、KYC、AML 合规、本地清算接口。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"case-box red\">\n    <div class=\"case-label red\">Off-ramp 为什么需要牌照？<\u002Fdiv>\n    Off-ramp 在法律上执行了：①接受加密货币（可能被视为\"接受存款\"）；②兑换成法币转入用户账户（货币兑换+汇款）。这触发了大多数国家对 MSB/MTL（美国）、EMI（欧盟）或 VASP（全球）的管辖。没有牌照做 Off-ramp，轻则业务被叫停，重则刑事追诉。\n  <\u002Fdiv>\n  <table class=\"tbl\">\n    <tbody><tr><th>牌照<\u002Fth><th>全称<\u002Fth><th>司法区<\u002Fth><th>难度<\u002Fth><th>时间线<\u002Fth><\u002Ftr>\n    <tr><td><span class=\"badge badge-blue\">MTL<\u002Fspan><\u002Ftd><td>Money Transmitter License，货币传输牌照<\u002Ftd><td>美国各州<\u002Ftd><td>极难<\u002Ftd><td>2-3年，48州分别申请<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-blue\">MSB<\u002Fspan><\u002Ftd><td>Money Services Business，货币服务业务<\u002Ftd><td>美国FinCEN<\u002Ftd><td>相对容易<\u002Ftd><td>14天注册，仍需各州MTL<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-amber\">VASP<\u002Fspan><\u002Ftd><td>Virtual Asset Service Provider<\u002Ftd><td>全球FATF框架<\u002Ftd><td>中等<\u002Ftd><td>3-12个月（各国不同）<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-teal\">MPI+DPT<\u002Fspan><\u002Ftd><td>Major Payment Institution + Digital Payment Token<\u002Ftd><td>新加坡MAS<\u002Ftd><td>中难<\u002Ftd><td>12-18个月<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-pink\">VATP<\u002Fspan><\u002Ftd><td>Virtual Asset Trading Platform<\u002Ftd><td>香港SFC<\u002Ftd><td>高<\u002Ftd><td>12-24个月<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-blue\">EMI<\u002Fspan><\u002Ftd><td>Electronic Money Institution，电子货币机构<\u002Ftd><td>欧盟各国央行<\u002Ftd><td>中等<\u002Ftd><td>6-18个月（立陶宛最快）<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">Omnibus Wallet（综合钱包）实现逻辑<\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">1<\u002Fdiv><div class=\"step-body\"><strong>链上结构：<\u002Fstrong>平台用<span class=\"hlb\">一个主地址<\u002Fspan>持有所有用户资金，用户 A 充100 USDC + 用户 B 充200 USDC → 链上总余额300 USDC。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">2<\u002Fdiv><div class=\"step-body\"><strong>链下账本：<\u002Fstrong>平台内部数据库记录 A: 100、B: 200。用户间转账只改数据库，不发链上交易，成本为零。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">3<\u002Fdiv><div class=\"step-body\"><strong>充值识别：<\u002Fstrong>给每用户分配独立充值地址，收款后自动 Sweep 归集到主 Omnibus 地址。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">4<\u002Fdiv><div class=\"step-body\"><strong>提款：<\u002Fstrong>用户提现时，平台从 Omnibus 向目标地址发起链上交易，扣除内部账本余额。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num red\">!<\u002Fdiv><div class=\"step-body\"><strong>监管风险：<\u002Fstrong>MiCA、香港 VATP 均要求\"客户资金隔离\"，需从 Omnibus 迁移到 per-user 独立地址，Gas 成本大增——这是许多交易所迟迟不合规的核心技术债。<\u002Fdiv><\u002Fdiv>\n  <div class=\"case-box\">\n    <div class=\"case-label\">成本对比（100万用户各10笔交易）<\u002Fdiv>\n    Omnibus：链上约100万次；独立地址：链上约1000万次。以太坊主网成本差距10-100倍。\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">Travel Rule（转账规则）<\u002Fdiv>\n  <p class=\"prose\" style=\"margin-bottom:8px\">FATF 要求：VASP 间转移超过阈值（多数国家 $1000），发送方 VASP 必须把发送人身份信息传给接收方 VASP。挑战：链上转账是地址对地址，天然不携带身份信息，需在链下并行建立身份传递系统。<\u002Fp>\n  <table class=\"tbl\">\n    <tbody><tr><th>协议<\u002Fth><th>实现逻辑<\u002Fth><th>主要用户<\u002Fth><\u002Ftr>\n    <tr><td><strong>Notabene<\u002Fstrong><\u002Ftd><td>VASP 注册目录+加密 API，链下传身份信息包，接收方验证后确认，再广播链上交易<\u002Ftd><td>Kraken、Bitfinex<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Sygna Bridge<\u002Fstrong><\u002Ftd><td>IVMS101 标准格式，提供白标 SDK，亚太覆盖广<\u002Ftd><td>亚太地区 VASP<\u002Ftd><\u002Ftr>\n    <tr><td><strong>OpenVASP<\u002Fstrong><\u002Ftd><td>开源协议，基于以太坊 ENS 寻址，P2P 直连，去中心化程度最高<\u002Ftd><td>欧洲系项目<\u002Ftd><\u002Ftr>\n    <tr><td><strong>VerifyVASP<\u002Fstrong><\u002Ftd><td>韩国主导，已集成多家韩日新加坡交易所<\u002Ftd><td>Upbit、Bithumb<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">Crypto 术语速查<\u002Fdiv>\n  <div class=\"term-grid\">\n    <div class=\"term-item\"><div class=\"term-abbr\">OTC<\u002Fdiv><div class=\"term-en\">Over The Counter，场外交易<\u002Fdiv><div class=\"term-zh\">不经交易所，双方直接大额交易（$10万+起），不影响市场深度。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">DEX / CEX<\u002Fdiv><div class=\"term-en\">去中心化/中心化交易所<\u002Fdiv><div class=\"term-zh\">DEX：链上 AMM 撮合，无 KYC，无托管，有滑点。CEX：需 KYC，Custodial，流动性好，受监管。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">MPC<\u002Fdiv><div class=\"term-en\">Multi-Party Computation，多方计算<\u002Fdiv><div class=\"term-zh\">私钥分片存储于多方，签名时联合计算，任何单方无法单独动用资金。机构钱包首选。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">TVL<\u002Fdiv><div class=\"term-en\">Total Value Locked，总锁仓量<\u002Fdiv><div class=\"term-zh\">DeFi 协议锁定的资产总价值。支付协议 TVL 高 = 结算能力强。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">RWA<\u002Fdiv><div class=\"term-en\">Real World Assets，现实世界资产<\u002Fdiv><div class=\"term-zh\">传统资产（国债、LC）代币化上链。BlackRock BUIDL 基金是目前最大规模 RWA 项目。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">Bridge / Gas fee<\u002Fdiv><div class=\"term-en\">跨链桥 / 链上手续费<\u002Fdiv><div class=\"term-zh\">Bridge：在不同区块链间转移资产。Gas fee：Ethereum 主网高，Solana/Stellar 低至 $0.001，影响小额支付可行性。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">Mint / Burn<\u002Fdiv><div class=\"term-en\">铸造 / 销毁<\u002Fdiv><div class=\"term-zh\">稳定币发行（Mint）和赎回（Burn）机制。$1存入→发行1 USDC；赎回→销毁1 USDC，返还$1。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ════ 加密U卡 ════ -->\n<div id=\"sec-ucard\" class=\"section\">\n<h2 class=\"section-title\">加密 U 卡<\u002Fh2>\n<p class=\"section-desc\">将加密资产\"塞进\"传统卡支付外壳的产品，技术上已成熟，瓶颈在合规。<\u002Fp>\n\n<div class=\"card\">\n  <div class=\"card-title\">本质与刷卡瞬间（约200ms内）<\u002Fdiv>\n  <p class=\"prose\" style=\"margin-bottom:10px\">U 卡是一个<span class=\"hlp\">实时 Off-ramp + 卡组织网络<\u002Fspan>的拼装产品。用户持有加密资产，消费时走 Visa/Mastercard 传统刷卡网络，商家完全感知不到 Crypto 的存在。<\u002Fp>\n  <div class=\"step\"><div class=\"step-num\">1<\u002Fdiv><div class=\"step-body\">用户在星巴克刷卡消费 $5，POS 机发出 Auth 授权请求，经 Visa 网络到达<strong> U 卡发行商系统<\u002Fstrong>。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">2<\u002Fdiv><div class=\"step-body\">发行商系统收到请求，立即从用户加密资产账户<strong>扣除等值 USDC<\u002Fstrong>（或 BTC）。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">3<\u002Fdiv><div class=\"step-body\">内部 Off-ramp 引擎将 USDC <strong>换算为美元<\u002Fstrong>，打入托管法币账户。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num green\">4<\u002Fdiv><div class=\"step-body\">向 Visa 网络返回<strong>授权通过<\u002Fstrong>，星巴克收到普通美元刷卡款，全程感知不到 Crypto。<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">预兑换 vs 实时换汇两种模式<\u002Fdiv>\n  <div class=\"grid2\">\n    <div class=\"grid-card\">\n      <div class=\"label\">预兑换模式<\u002Fdiv>\n      <div class=\"body\">充值时即将加密资产换为法币，存入托管账户。<br><br><span class=\"hlg\">优点：<\u002Fspan>汇率确定，无消费时滑点，用户体验简单。<br><span class=\"hlr\">缺点：<\u002Fspan>用户提前承担换汇机会成本，无法持有加密资产升值。<br><br><strong>代表：<\u002Fstrong>Crypto.com Card<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid-card\">\n      <div class=\"label\">实时换汇模式<\u002Fdiv>\n      <div class=\"body\">加密资产保持原形态，消费瞬间实时换汇。<br><br><span class=\"hlg\">优点：<\u002Fspan>资产保持 Crypto 形态，灵活性高。<br><span class=\"hlr\">缺点：<\u002Fspan>消费时有汇率滑点风险，技术复杂度更高（需在200ms内完成 Off-ramp）。<br><br><strong>代表：<\u002Fstrong>Wirex Card<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">合规三层架构<\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">1<\u002Fdiv><div class=\"step-body\"><strong>卡组织准入（BIN Sponsor 结构）：<\u002Fstrong>Visa/MC 不直接与 Crypto 公司合作 → 需持牌银行/EMI 作为 BIN Sponsor → 合规责任由银行最终承担 → Crypto 公司须满足银行的 KYC/AML 审查标准。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">2<\u002Fdiv><div class=\"step-body\"><strong>Off-ramp 牌照：<\u002Fstrong>实时换汇 = 货币兑换+汇款 → 需 MSB/MTL（美国）、EMI/PI（欧盟）或等效 VASP 牌照。无牌照做 Off-ramp 即为违规。<\u002Fdiv><\u002Fdiv>\n  <div class=\"step\"><div class=\"step-num\">3<\u002Fdiv><div class=\"step-body\"><strong>KYC/AML 双重触发 + 税务风险：<\u002Fstrong>支付侧 KYC（卡组织/银行要求）+ Crypto 侧 KYC（VASP 要求），用户做一次 KYC，发行商后台满足两套标准。<br><br><span class=\"hlr\">税务风险：<\u002Fspan>每笔消费对应一次 Off-ramp，在部分司法区被视为\"应税事件\"（Taxable Event）——用户每次刷卡均可能产生加密资产资本利得税，是最容易被忽视的合规风险。<\u002Fdiv><\u002Fdiv>\n  <div class=\"case-box\">\n    <div class=\"case-label\">核心瓶颈<\u002Fdiv>\n    U 卡技术层面已成熟，瓶颈在于：①每个市场的 BIN Sponsor 银行合作关系（银行风控极严）；②各地牌照获取时间和成本；③持续的链上 AML 监控成本；④部分司法区的税务处理合规成本转嫁问题。\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">主流 U 卡项目牌照路径<\u002Fdiv>\n  <table class=\"tbl\">\n    <tbody><tr><th>项目<\u002Fth><th>BIN Sponsor<\u002Fth><th>核心牌照<\u002Fth><th>市场覆盖<\u002Fth><\u002Ftr>\n    <tr><td><strong>Crypto.com Visa<\u002Fstrong><\u002Ftd><td>Sutton Bank（美国）<\u002Ftd><td>立陶宛 EMI（欧盟）、新加坡 MPI<\u002Ftd><td>美国、欧盟、新加坡、澳大利亚<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Wirex<\u002Fstrong><\u002Ftd><td>合作持牌银行<\u002Ftd><td>英国 FCA EMI、欧盟 Passport<\u002Ftd><td>英国、欧盟、美国（部分州）<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Binance Card<\u002Fstrong><\u002Ftd><td>Moorwand（持牌 EMI）<\u002Ftd><td>欧洲通过 BIN Sponsor；美国受限<\u002Ftd><td>欧洲为主<\u002Ftd><\u002Ftr>\n    <tr><td><strong>Coinbase Card<\u002Fstrong><\u002Ftd><td>Sutton Bank（美国）<\u002Ftd><td>BitLicense、各州 MTL<\u002Ftd><td>美国、英国<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ════ 合规监管 ════ -->\n<div id=\"sec-comp\" class=\"section\">\n<h2 class=\"section-title\">合规监管<\u002Fh2>\n<p class=\"section-desc\">对 Crypto 从业者来说，这些缩写词不陌生，但支付场景下有一些细微差别值得特别关注。<\u002Fp>\n\n<div class=\"card\">\n  <div class=\"card-title\">KYC / KYB / KYT 三层验证体系<\u002Fdiv>\n  <div class=\"term-grid\">\n    <div class=\"term-item\"><div class=\"term-abbr\">KYC<\u002Fdiv><div class=\"term-en\">Know Your Customer，客户身份识别<\u002Fdiv><div class=\"term-zh\">个人验证：护照+自拍+地址证明。初级 KYC 通常限额，高级 KYC 需视频核身。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">KYB<\u002Fdiv><div class=\"term-en\">Know Your Business，企业身份识别<\u002Fdiv><div class=\"term-zh\">企业验证：营业执照+UBO 穿透+银行对账单。关键：穿透到 UBO 自然人，核查制裁名单。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">KYT<\u002Fdiv><div class=\"term-en\">Know Your Transaction，交易监控<\u002Fdiv><div class=\"term-zh\">实时分析交易行为。工具：Chainalysis、Elliptic。识别混币器（Tornado Cash）交互、暗网关联地址等。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">CDD / EDD<\u002Fdiv><div class=\"term-en\">Customer Due Diligence / Enhanced Due Diligence<\u002Fdiv><div class=\"term-zh\">CDD：标准级别客户审查。EDD：对高风险客户（PEP、高风险国家、大额）的深度审查。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">PEP<\u002Fdiv><div class=\"term-en\">Politically Exposed Person，政治敏感人物<\u002Fdiv><div class=\"term-zh\">担任重要公职的人及其关联人（家属、亲密同事）。自动触发 EDD，部分机构直接拒绝开户。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">UBO<\u002Fdiv><div class=\"term-en\">Ultimate Beneficial Owner，最终受益人<\u002Fdiv><div class=\"term-zh\">实际控制企业或持有25%+股权的自然人。层层穿透是 KYB 中最耗时的环节。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">SOF / SOW<\u002Fdiv><div class=\"term-en\">Source of Funds / Source of Wealth<\u002Fdiv><div class=\"term-zh\">SOF：这笔钱从哪来？SOW：你的总财富怎么积累的？高净值用户大额充值时同时要求两者。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">AML / CTF<\u002Fdiv><div class=\"term-en\">Anti-Money Laundering / Counter-Terrorism Financing<\u002Fdiv><div class=\"term-zh\">反洗钱+反恐融资，通常合并执行。是支付机构合规运营的核心义务。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">STR / SAR<\u002Fdiv><div class=\"term-en\">Suspicious Transaction/Activity Report，可疑交易报告<\u002Fdiv><div class=\"term-zh\">发现异常后向监管机构提交，且不得告知客户（Tipping-off 禁令）。Crypto 交易所同样有此义务。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">FATF<\u002Fdiv><div class=\"term-en\">Financial Action Task Force，金融行动特别工作组<\u002Fdiv><div class=\"term-zh\">全球 AML/CTF 标准制定机构。发布灰名单/黑名单，被列入的国家面临金融孤立压力。<\u002Fdiv><\u002Fdiv>\n    <div class=\"term-item\"><div class=\"term-abbr\">Sanctions screening<\u002Fdiv><div class=\"term-en\">制裁名单筛查<\u002Fdiv><div class=\"term-zh\">检查交易方是否在 OFAC（SDN 名单）、EU、UN 制裁名单上。Chainalysis 提供链上地址制裁筛查。<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">主要监管机构<\u002Fdiv>\n  <table class=\"tbl\">\n    <tbody><tr><th>机构<\u002Fth><th>全称<\u002Fth><th>司法区<\u002Fth><th>职能<\u002Fth><\u002Ftr>\n    <tr><td><span class=\"badge badge-blue\">FinCEN<\u002Fspan><\u002Ftd><td>Financial Crimes Enforcement Network，金融犯罪执法局<\u002Ftd><td>美国<\u002Ftd><td>MSB 注册、SAR 收集、AML 监管<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-blue\">OFAC<\u002Fspan><\u002Ftd><td>Office of Foreign Assets Control，海外资产控制办公室<\u002Ftd><td>美国<\u002Ftd><td>管理 SDN 制裁名单，执行经济制裁<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-teal\">MAS<\u002Fspan><\u002Ftd><td>Monetary Authority of Singapore，新加坡金管局<\u002Ftd><td>新加坡<\u002Ftd><td>央行+金融监管，MPI/DPT 牌照<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-pink\">SFC<\u002Fspan><\u002Ftd><td>Securities and Futures Commission，香港证监会<\u002Ftd><td>香港<\u002Ftd><td>VATP 牌照，证券/期货监管<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-pink\">HKMA<\u002Fspan><\u002Ftd><td>Hong Kong Monetary Authority，香港金管局<\u002Ftd><td>香港<\u002Ftd><td>银行监管、SVF 牌照、稳定币发行<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-amber\">SAFE<\u002Fspan><\u002Ftd><td>国家外汇管理局，State Administration of Foreign Exchange<\u002Ftd><td>中国<\u002Ftd><td>外汇管制、跨境人民币结算<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ════ 牌照地图 ════ -->\n<div id=\"sec-lic\" class=\"section\">\n<h2 class=\"section-title\">牌照地图<\u002Fh2>\n<p class=\"section-desc\">不同市场做支付业务需要不同牌照。点击地图上的国家或图例查看各地区核心牌照。<\u002Fp>\n\n<div class=\"card\">\n  <div class=\"map-legend\" id=\"map-legend\">\n    <div class=\"map-leg\" onclick=\"highlightRegion('americas')\"><div class=\"map-leg-dot\" style=\"background:#2E6DA4\"><\u002Fdiv>美国/加拿大<\u002Fdiv>\n    <div class=\"map-leg\" onclick=\"highlightRegion('latam')\"><div class=\"map-leg-dot\" style=\"background:#5C4BB0\"><\u002Fdiv>拉丁美洲<\u002Fdiv>\n    <div class=\"map-leg\" onclick=\"highlightRegion('europe')\"><div class=\"map-leg-dot\" style=\"background:#0E7C6B\"><\u002Fdiv>欧洲<\u002Fdiv>\n    <div class=\"map-leg\" onclick=\"highlightRegion('apac')\"><div class=\"map-leg-dot\" style=\"background:#A6396A\"><\u002Fdiv>亚太<\u002Fdiv>\n    <div class=\"map-leg\" onclick=\"highlightRegion('me')\"><div class=\"map-leg-dot\" style=\"background:#8C5A11\"><\u002Fdiv>中东<\u002Fdiv>\n    <div class=\"map-leg\" onclick=\"highlightRegion('africa')\"><div class=\"map-leg-dot\" style=\"background:#047857\"><\u002Fdiv>非洲<\u002Fdiv>\n  <\u002Fdiv>\n  <div id=\"loading-map\" style=\"text-align:center;padding:40px;font-size:13px;color:var(--text3)\">加载地图数据中…<\u002Fdiv>\n  <svg id=\"world-map\" viewBox=\"0 0 960 500\" style=\"display:none;width:100%;border-radius:var(--radius);background:var(--bg2)\"><\u002Fsvg>\n  <div class=\"map-tip\" id=\"map-tip\">\n    <div class=\"map-tip-title\" id=\"map-tip-title\" style=\"color:var(--text3)\">点击地图上的国家或上方图例查看该地区牌照详情<\u002Fdiv>\n    <div class=\"map-tip-items\" id=\"map-tip-items\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"card\">\n  <div class=\"card-title\">牌照速查表<\u002Fdiv>\n  <div class=\"slabel\">美洲<\u002Fdiv>\n  <table class=\"tbl\">\n    <tbody><tr><th>牌照<\u002Fth><th>全称<\u002Fth><th>机构<\u002Fth><th>要点<\u002Fth><\u002Ftr>\n    <tr><td><span class=\"badge badge-blue\">MTL<\u002Fspan><\u002Ftd><td>Money Transmitter License<\u002Ftd><td>美国各州<\u002Ftd><td>48州+DC需分别申请，2-3年，数百万成本<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-blue\">MSB<\u002Fspan><\u002Ftd><td>Money Services Business<\u002Ftd><td>FinCEN（联邦）<\u002Ftd><td>14天注册，无审批，但仍需各州MTL<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-blue\">BitLicense<\u002Fspan><\u002Ftd><td>—<\u002Ftd><td>NYDFS（纽约州）<\u002Ftd><td>全美最严格的加密牌照，审批2-3年<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-purple\">PSP（巴西）<\u002Fspan><\u002Ftd><td>Payment Service Provider<\u002Ftd><td>巴西央行BCB<\u002Ftd><td>开放银行体系，Pix实时支付已成全球模板<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-purple\">PSSP（墨西哥）<\u002Fspan><\u002Ftd><td>Payment Service Provider/Institution<\u002Ftd><td>CNBV<\u002Ftd><td>2018年金融科技法框架，拉美重要牌照<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n  <div class=\"slabel\">欧洲<\u002Fdiv>\n  <table class=\"tbl\">\n    <tbody><tr><th>牌照<\u002Fth><th>全称<\u002Fth><th>机构<\u002Fth><th>要点<\u002Fth><\u002Ftr>\n    <tr><td><span class=\"badge badge-teal\">EMI<\u002Fspan><\u002Ftd><td>Electronic Money Institution，电子货币机构<\u002Ftd><td>各国央行/EBA<\u002Ftd><td>EU内Passport到27国，€350k资本，立陶宛最热门<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-teal\">PI<\u002Fspan><\u002Ftd><td>Payment Institution，支付机构<\u002Ftd><td>各国央行<\u002Ftd><td>只能提供支付服务，€125k资本<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-teal\">AISP/PISP<\u002Fspan><\u002Ftd><td>Account/Payment Initiation Service Provider<\u002Ftd><td>PSD2框架<\u002Ftd><td>账户信息/支付发起服务，门槛最低<\u002Ftd><\u002Ftr>\n    <tr><td><span class=\"badge badge-teal\">MiCA CASP<\u002Fspan><\u002Ftd><td>Crypto-Asset Service Provider<\u002Ftd><td>欧盟MiCA（2024）<\u002Ftd><td>统一EU加密监管，支持Passport<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n
